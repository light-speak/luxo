name: Compare shared benchmark fixtures on PR 71 and PR 72

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-frozen-fixtures.yml
      - scripts/diagnose-frozen-fixtures.sh

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'light-speak/luxo'
    strategy:
      fail-fast: false
      matrix:
        suite: [pr71, pr72]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the frozen public source parents
        run: >-
          git fetch --no-tags origin
          ca818da9bf89e82dc6f5bd2f539e4dfdd576a801
          ec041a07b105c9caf9e327a2cbf73de772582d00
          a75a0acce23b30e3f99d44b0c47f746901b82bb8
          5e4c9d1b3813cc95f98d4088a10c242dca47b8de
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Build and measure the same test fixtures on both revisions
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: 1
        run: bash scripts/diagnose-frozen-fixtures.sh '${{ matrix.suite }}'
      - name: Preserve raw samples and source bindings
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-frozen-fixtures-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-frozen-fixtures-${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 14
      - name: Remove uploaded evidence from this runner
        if: always()
        run: rm -rf -- '.tmp/hosted-frozen-fixtures-${{ matrix.suite }}'
