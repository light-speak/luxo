name: Diagnose hosted scalar projection and pagination performance

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-scalar-projection.yml
      - scripts/diagnose-scalar-projection.sh
      - scripts/diagnose-scalar-projection/**

permissions:
  contents: read

concurrency:
  group: hosted-scalar-projection
  cancel-in-progress: false

jobs:
  diagnose-scalar-projection:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Measure two paired groups with native default linking
        env:
          GOTOOLCHAIN: local
        run: bash scripts/diagnose-scalar-projection.sh
      - name: Preserve raw samples, scoped verdict and source hashes
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-scalar-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-scalar-projection-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove local evidence after upload
        if: always()
        run: rm -rf -- .tmp/hosted-scalar-projection-evidence
