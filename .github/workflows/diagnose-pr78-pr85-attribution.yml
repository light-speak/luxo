name: Attribute PR 78 and 85 anonymous auth timing

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-pr78-pr85-attribution.yml
      - scripts/diagnose-pr78-pr85-attribution.sh
      - scripts/diagnose-pr78-pr85-attribution.py
      - scripts/diagnose-pr78-pr85/**

permissions:
  contents: read

concurrency:
  group: hosted-pr78-pr85-attribution
  cancel-in-progress: false

jobs:
  native-attribution:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Sample all six Luvia binaries and the direct controls on this runner
        timeout-minutes: 24
        env:
          GOAMD64: v1
          CGO_ENABLED: '1'
          GOTOOLCHAIN: local
        run: bash scripts/diagnose-pr78-pr85-attribution.sh
      - name: Preserve exact revisions, raw samples, and binary layout
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-pr78-pr85-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr78-pr85-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Clean the uploaded evidence
        if: always()
        run: rm -rf -- .tmp/hosted-pr78-pr85-evidence
