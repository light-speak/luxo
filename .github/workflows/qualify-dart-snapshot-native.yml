name: Qualify Dart snapshot boundaries natively

on:
  push:
    branches: [diagnostics/dart-snapshot-native]
    paths:
      - '.github/workflows/qualify-dart-snapshot-native.yml'
      - '.github/qualification/dart-snapshot-native.py'
      - '.github/qualification/dart-snapshot-product.patch.b64'

permissions:
  contents: read

jobs:
  native:
    name: native (windows)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'

      - name: Verify the pinned native Dart boundary
        env:
          DART_NATIVE_PLATFORM: windows
        run: python .github/qualification/dart-snapshot-native.py

      - name: Preserve exact source, test events and physical coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dart-snapshot-boundary-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/dart-snapshot-native-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
