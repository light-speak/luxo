name: Diagnose PR 74 authorization lookup on one native runner

on:
  workflow_dispatch:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-pr74-authorization-lookup.yml
      - scripts/diagnose-pr74-authorization-lookup.*

permissions:
  contents: read

concurrency:
  group: hosted-pr74-authorization-lookup
  cancel-in-progress: false

jobs:
  diagnose-pr74-authorization-lookup:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Compare the release and matched-test extractor on one runner
        timeout-minutes: 15
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: '1'
        run: bash scripts/diagnose-pr74-authorization-lookup.sh
      - name: Preserve raw comparisons, control verdicts, and binary layout
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-pr74-authorization-lookup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr74-authorization-lookup/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove the evidence directory after upload
        if: always()
        run: |
          test ! -L .tmp
          rm -rf -- .tmp/hosted-pr74-authorization-lookup
