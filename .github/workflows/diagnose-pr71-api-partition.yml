name: Diagnose PR 71 API signer linkage on current main

on:
  push:
    branches: [diagnostics/pr71-api-partition]
    paths:
      - .github/workflows/diagnose-pr71-api-partition.yml
      - scripts/diagnose-pr71-api-partition.sh

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr71-api-partition'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the exact main and PR 71 source commits
        run: >-
          git fetch --no-tags origin
          a79928f9673744f6c7020466272acea2fc4dbb5d
          ec041a07b105c9caf9e327a2cbf73de772582d00
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Verify exact partitions and sample both link conditions
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: 1
        run: bash scripts/diagnose-pr71-api-partition.sh
      - name: Preserve inventories and duplicate-free sample pairs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-pr71-api-partition-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr71-api-partition/
          if-no-files-found: error
          retention-days: 14
