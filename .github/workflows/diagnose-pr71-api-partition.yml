name: Diagnose PR 71 API and Luvia linkage on AMD EPYC 7763

on:
  push:
    branches: [diagnostics/pr71-api-partition]
    paths:
      - .github/workflows/diagnose-pr71-api-partition.yml
      - scripts/diagnose-pr71-api-partition.sh
      - scripts/diagnose-pr71-linked-fixtures.py

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr71-api-partition'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the exact main and PR 71 source commits
        run: >-
          git fetch --no-tags origin
          925f30ee1dcd45882b29130b8ed02836ed88317e
          ec041a07b105c9caf9e327a2cbf73de772582d00
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Verify the runner model and sample both fixtures on that host
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: 1
        run: bash scripts/diagnose-pr71-api-partition.sh
      - name: Preserve inventories and duplicate-free sample pairs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-pr71-linked-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr71-linked-fixtures/
          if-no-files-found: error
          retention-days: 14
