name: Verify frozen benchmark fixture gate controls

on:
  workflow_dispatch:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-frozen-gate-controls.yml
      - scripts/diagnose-frozen-gate-controls.*

permissions:
  contents: read

jobs:
  controls:
    if: github.repository == 'light-speak/luxo'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the official benchmark verifier revision
        run: git fetch --no-tags origin ca818da9bf89e82dc6f5bd2f539e4dfdd576a801
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Check the controls and run both native sample groups
        run: |
          bash scripts/diagnose-frozen-gate-controls.sh --plan
          bash scripts/diagnose-frozen-gate-controls.sh --measure
      - name: Preserve full control evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frozen-gate-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-frozen-gate-controls/
          if-no-files-found: error
          retention-days: 14
      - name: Remove archived local evidence
        if: always()
        run: rm -rf -- .tmp/hosted-frozen-gate-controls
