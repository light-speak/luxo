name: Verify prepared Dart output on native platforms

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-dart-prepared-native.yml
      - scripts/diagnose-dart-prepared-native.*

permissions:
  contents: read

jobs:
  dart-prepared-native:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'

      - name: Materialize the verified candidate
        run: |
          set -euo pipefail
          stage="$PWD/.tmp/dart-prepared-native"
          mkdir -p "$stage/source" "$stage/evidence"
          cp scripts/diagnose-dart-prepared-native.py "$stage/run-gates.py"
          cp scripts/diagnose-dart-prepared-native.json "$stage/evidence/manifest.json"
          base="$(python -c 'import json; print(json.load(open("scripts/diagnose-dart-prepared-native.json"))["base"])')"
          git show -s --format='%H %T' "$base" | tee "$stage/evidence/base.txt"
          git -c core.autocrlf=false archive "$base" | tar -xf - -C "$stage/source"
          git init -q "$stage/source"
          python - before <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          manifest = json.loads(Path("scripts/diagnose-dart-prepared-native.json").read_text())
          patch = manifest["patch"].encode("utf-8")
          assert hashlib.sha256(patch).hexdigest() == manifest["patchSha256"]
          source = Path(".tmp/dart-prepared-native/source")
          (source.parent / "candidate.patch").write_bytes(patch)
          for row in manifest["files"]:
              path = source / row["path"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert digest == row[sys.argv[1] + "Sha256"], row["path"]
          PY
          patch="$stage/candidate.patch"
          git -C "$stage/source" -c core.autocrlf=false apply --check --whitespace=error "$patch"
          git -C "$stage/source" -c core.autocrlf=false apply --whitespace=error "$patch"
          python - after <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          manifest = json.loads(Path("scripts/diagnose-dart-prepared-native.json").read_text())
          source = Path(".tmp/dart-prepared-native/source")
          for row in manifest["files"]:
              path = source / row["path"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row[sys.argv[1] + "Sha256"], row["path"]
          PY
          git -C "$stage/source" -c core.autocrlf=false apply -R --check "$patch"

      - name: Resolve the existing Dart dependencies
        working-directory: .tmp/dart-prepared-native/source/packages/dart
        run: dart pub get

      - name: Verify release publication and ordinary AOT execution
        run: |
          set -euo pipefail
          version="$(dart --version 2>&1)"
          printf '%s\n' "$version"
          [[ "$version" == "Dart SDK version: 3.13.4 (stable) "* ]]
          executable="$(python -c 'import os, shutil; p = shutil.which("dart.exe" if os.name == "nt" else "dart"); assert p; print(p)')"
          python .tmp/dart-prepared-native/run-gates.py --dart "$executable" --mode native --label native
          cat .tmp/dart-prepared-native/evidence/native/receipt.json

      - name: Preserve source hashes and native test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dart-prepared-native-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/dart-prepared-native/evidence/
          if-no-files-found: error
          retention-days: 14
