name: Attribute PR 73 a75 confirmed leaves

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-pr73-a75-confirmation.yml
      - scripts/diagnose-pr73-a75-confirmation.sh
      - scripts/diagnose-pr73-a75-confirmation.json
  workflow_dispatch:
    inputs:
      primary_replay:
        description: Replay each original 52-leaf primary once per role after the confirmation experiment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hosted-pr73-a75-confirmation
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    strategy:
      fail-fast: false
      matrix:
        suite: [int, float]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the two real source parents and frozen diagnostic helpers
        run: >-
          git fetch --no-tags origin
          a75a0acce23b30e3f99d44b0c47f746901b82bb8
          9474fabe422599733143763e5749729cc0656c28
          d2533667e3ae147570d903cfcec6ed54d7c3141d
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Measure original confirmation leaf in A/A and A/H
        timeout-minutes: 18
        env:
          GOTOOLCHAIN: local
          PR73_PRIMARY_REPLAY: ${{ inputs.primary_replay && '1' || '0' }}
        run: bash scripts/diagnose-pr73-a75-confirmation.sh '${{ matrix.suite }}'
      - name: Preserve sources, raw samples, binaries, layout and verdicts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-pr73-a75-confirmation-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr73-a75-confirmation-${{ matrix.suite }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove uploaded evidence
        if: always()
        run: rm -rf -- '.tmp/hosted-pr73-a75-confirmation-${{ matrix.suite }}'
