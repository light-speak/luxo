name: Verify the nine current PR 74 performance confirmations

on:
  push:
    branches: [diagnostics/pr74-current-confirmations]
    paths:
      - .github/workflows/diagnose-pr74-current-confirmations.yml
      - scripts/diagnose-frozen-fixtures.sh

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr74-current-confirmations'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the exact verified release and PR revisions
        run: git fetch --no-tags origin ca818da9bf89e82dc6f5bd2f539e4dfdd576a801 f33b2f2a37044555807b53e9998f7df0c5315e20
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Interleave the same-runner controls and complete confirmation scope
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: '1'
        run: bash scripts/diagnose-frozen-fixtures.sh pr74-current
      - name: Preserve raw samples and locked fixture evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr74-current-confirmations-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-frozen-fixtures-pr74-current/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
