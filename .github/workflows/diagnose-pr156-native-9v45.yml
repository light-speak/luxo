name: Recheck PR 156 compiler timing on AMD EPYC 9V45

on:
  push:
    branches: [diagnostics/pr156-native-9v45]

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Match the original CPU before setup
        id: route
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: python3 -I -B scripts/diagnose-pr156-native-9v45/run.py --probe

      - if: steps.route.outputs.matched == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false

      - if: steps.route.outputs.matched == 'true'
        uses: actions/checkout@v7
        with:
          ref: f8924ac56afa77c460d7fc62f81df10e2673c202
          path: .tmp/pr156-native-9v45-inputs/A
          persist-credentials: false

      - if: steps.route.outputs.matched == 'true'
        uses: actions/checkout@v7
        with:
          ref: 0f55dd635168a58b25d82e08460e10046d2cc0ba
          path: .tmp/pr156-native-9v45-inputs/H
          fetch-depth: 2
          persist-credentials: false

      - if: steps.route.outputs.matched == 'true'
        name: Compare original and projected compiler binaries
        timeout-minutes: 30
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: python3 -I -B scripts/diagnose-pr156-native-9v45/run.py

      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr156-native-9v45-${{ github.run_id }}-${{ github.run_attempt }}-slot-${{ matrix.slot }}
          path: .tmp/pr156-native-9v45-evidence
          if-no-files-found: error
          retention-days: 14

  qualification:
    needs: witness
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/diagnose-pr156-native-9v45
          persist-credentials: false

      - name: Report strict results and routing coverage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          results=$(mktemp -d .tmp/pr156-native-9v45-receipts.XXXXXXXX)
          trap 'rm -rf -- "$results"' EXIT
          gh run download "$GITHUB_RUN_ID" --pattern "pr156-native-9v45-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-slot-*" --dir "$results"
          python3 -I -B scripts/diagnose-pr156-native-9v45/run.py --summarize "$results"
