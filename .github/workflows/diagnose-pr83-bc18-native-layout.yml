name: Recheck PR 83 timing on AMD EPYC 9V45

on:
  push:
    branches: [diagnostics/pr83-b5-native-9v45]

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    env:
      GOTOOLCHAIN: local
      SLOT: ${{ matrix.slot }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Match the original CPU before setup
        id: route
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: python3 -I -B scripts/diagnose-pr83-bc18-native-layout/run.py --probe

      - if: steps.route.outputs.matched == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false

      - if: steps.route.outputs.matched == 'true'
        uses: actions/checkout@v7
        with:
          ref: 5376367706e217b18a676dfe932004a0f5419a04
          path: .tmp/pr83-native-harness
          sparse-checkout: scripts/diagnose-pr83-amd
          persist-credentials: false

      - if: steps.route.outputs.matched == 'true'
        uses: actions/checkout@v7
        with:
          ref: b5f6b0eb95f93516c306ca47dd74a1b532ecf018
          path: .tmp/pr83-bc18-native-inputs/A
          persist-credentials: false

      - if: steps.route.outputs.matched == 'true'
        uses: actions/checkout@v7
        with:
          ref: f72667fbb2f76101e611a45cfc9cbb670548b6db
          path: .tmp/pr83-bc18-native-inputs/H
          fetch-depth: 2
          persist-credentials: false

      - if: steps.route.outputs.matched == 'true'
        name: Compare original and link-aligned binaries
        timeout-minutes: 27
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: python3 -I -B scripts/diagnose-pr83-bc18-native-layout/run.py

      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr83-bc18-native-layout-${{ github.run_id }}-${{ github.run_attempt }}-slot-${{ matrix.slot }}
          path: .tmp/pr83-bc18-native-evidence
          if-no-files-found: error
          retention-days: 14

  qualification:
    needs: witness
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/diagnose-pr83-bc18-native-layout
          persist-credentials: false

      - name: Require all original signals on a matching 9V45 slot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          results=$(mktemp -d .tmp/pr83-bc18-native-layout-receipts.XXXXXXXX)
          trap 'rm -rf -- "$results"' EXIT
          gh run download "$GITHUB_RUN_ID" --pattern "pr83-bc18-native-layout-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-slot-*" --dir "$results"
          python3 -I -B scripts/diagnose-pr83-bc18-native-layout/run.py --summarize "$results" "$GITHUB_SHA"
