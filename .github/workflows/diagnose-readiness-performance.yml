name: Qualify gateway and readiness performance

on:
  push:
    branches: [diagnostics/hosted-readiness-e101]
    paths:
      - .github/workflows/diagnose-readiness-performance.yml
      - scripts/diagnostics/readiness-hosted/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-readiness-e101
  cancel-in-progress: false

jobs:
  qualify-readiness:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-readiness-e101'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Verify and measure both exact readiness lanes
        timeout-minutes: 30
        run: python3 -I -B scripts/diagnostics/readiness-hosted/hosted.py run
      - name: Preserve both raw groups, controls, and gate results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-readiness-e101-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/readiness-hosted-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Remove the owned runner evidence after upload
        if: always()
        run: python3 -I -B scripts/diagnostics/readiness-hosted/hosted.py clean
