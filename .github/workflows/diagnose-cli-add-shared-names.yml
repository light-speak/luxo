name: Compare shared name validation performance for CLI add

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-cli-add-shared-names.yml
      - scripts/diagnose-cli-add-shared-names.sh
      - .github/qualification/cli-add.patch.b64

permissions:
  contents: read

concurrency:
  group: hosted-cli-add-shared-names
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Compare the shared string and generator paths with frozen benchmark fixtures
        timeout-minutes: 17
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: '1'
        run: bash scripts/diagnose-cli-add-shared-names.sh
      - name: Preserve exact source manifests and raw performance samples
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-cli-add-shared-names-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-cli-add-shared-names/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove uploaded evidence
        if: always()
        run: |
          test ! -L .tmp
          rm -rf -- .tmp/hosted-cli-add-shared-names
