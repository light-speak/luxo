name: Measure columnar merge terminator handling

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-columnar-merge.yml
      - scripts/diagnose-columnar-merge.sh
      - scripts/diagnose-columnar-merge.patch.b64
      - scripts/diagnose-columnar-merge.go.txt

permissions:
  contents: read

concurrency:
  group: hosted-columnar-merge
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        anchor: [main, pr71]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Check wire equivalence and run both paired comparisons
        timeout-minutes: 18
        env:
          DIAGNOSTIC_ANCHOR: ${{ matrix.anchor }}
        run: bash scripts/diagnose-columnar-merge.sh "$DIAGNOSTIC_ANCHOR"
      - name: Preserve exact source, sample and verdict evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-columnar-merge-${{ matrix.anchor }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-columnar-merge-${{ matrix.anchor }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Clean local diagnostic evidence after upload
        if: always()
        env:
          DIAGNOSTIC_ANCHOR: ${{ matrix.anchor }}
        run: rm -rf -- ".tmp/hosted-columnar-merge-$DIAGNOSTIC_ANCHOR"
