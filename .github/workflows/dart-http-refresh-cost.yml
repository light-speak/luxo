name: Dart HTTP refresh performance

on:
  push:
    branches: [diag/dart-http-refresh-cost]
    paths:
      - '.github/workflows/dart-http-refresh-cost.yml'
      - '.github/diagnostics/dart-http-refresh/**'

permissions:
  contents: read

jobs:
  refresh:
    name: Dart HTTP refresh / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 4
          persist-credentials: false

      - name: Require the original AMD processor
        id: cpu
        shell: bash
        run: |
          set -euo pipefail
          evidence=.tmp/dart-http-refresh-evidence
          mkdir -p "$evidence"
          model=$(LC_ALL=C lscpu | awk -F: '$1 == "Model name" {sub(/^[[:space:]]+/, "", $2); sub(/[[:space:]]+$/, "", $2); print $2}')
          match=false
          if [[ "$(uname -sm)" == 'Linux x86_64' && "$model" == 'AMD EPYC 9V74 80-Core Processor' ]]; then
            match=true
          fi
          printf 'model=%s\nmatch=%s\n' "$model" "$match" | tee "$evidence/routing.txt"
          printf 'match=%s\n' "$match" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@v1
        if: steps.cpu.outputs.match == 'true'
        with:
          sdk: '3.13.4'

      - uses: actions/setup-go@v7
        if: steps.cpu.outputs.match == 'true'
        with:
          go-version-file: go.mod
          cache: false

      - name: Bind the locked Dart arms and take paired samples
        if: steps.cpu.outputs.match == 'true'
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          mkdir -p .tmp/dart-http-refresh-evidence
          python3 -I -B .github/diagnostics/dart-http-refresh/qualify.py collect \
            --repo "$GITHUB_WORKSPACE" --scratch "$GITHUB_WORKSPACE/.tmp" \
            --evidence "$GITHUB_WORKSPACE/.tmp/dart-http-refresh-evidence" \
            | tee .tmp/dart-http-refresh-evidence/setup.jsonl

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dart-http-refresh-linux-x64-${{ github.run_attempt }}
          path: .tmp/dart-http-refresh-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Report a processor mismatch after preserving the routing receipt
        if: ${{ always() && steps.cpu.outputs.match == 'false' }}
        run: exit 3
