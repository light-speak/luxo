name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: luxo
          POSTGRES_PASSWORD: luxo
          POSTGRES_DB: luxo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U luxo"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: luxo
      DATABASE_PASSWORD: luxo
      DATABASE_PREFIX: luxo_test
      DATABASE_SSL: disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: |
          go test ./pkg/... -v -coverprofile=coverage.out -timeout 180s -count=1
          go test ./cmd/... -v -timeout 60s -count=1

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Coverage gate (minimum 94.5%)
        run: |
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${TOTAL}%"
          if (( $(echo "$TOTAL < 94.5" | bc -l) )); then
            echo "::error::Coverage ${TOTAL}% is below 94.5% threshold"
            exit 1
          fi
          echo "Coverage ${TOTAL}% meets threshold"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./pkg/... ./cmd/...

      - name: Gofmt check
        run: |
          UNFORMATTED=$(gofmt -l pkg/ cmd/)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Files not formatted: $UNFORMATTED"
            exit 1
          fi

      - name: Gocyclo check
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          VIOLATIONS=$(gocyclo -over 25 pkg/)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Cyclomatic complexity > 25:"
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: Build
        run: go build ./pkg/... ./cmd/...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fuzz Lexer
        run: go test ./pkg/lexer/ -fuzz=FuzzLexer -fuzztime=30s -timeout=120s

      - name: Fuzz Parser
        run: go test ./pkg/parser/ -fuzz=FuzzParser -fuzztime=30s -timeout=120s

      - name: Fuzz Semantic
        run: go test ./pkg/semantic/ -fuzz=FuzzAnalyzer -fuzztime=30s -timeout=120s

  sdk-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: cd packages/vite-plugin && pnpm install

      - name: Test vite-plugin
        run: cd packages/vite-plugin && pnpm test

  sdk-swift:
    runs-on: macos-latest
    steps:
      - name: Checkout Swift SDK
        uses: actions/checkout@v7
        with:
          repository: light-speak/luxo-swift
          ref: main

      - name: Test Swift SDK
        run: swift test
