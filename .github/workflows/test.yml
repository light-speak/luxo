name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d luxo_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_PREFIX: luxo_test
      DATABASE_SSL: disable
      LUXO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/luxo_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: |
          go test ./pkg/... ./scripts/... -v -coverprofile=coverage.out -timeout 180s -count=1
          go test ./cmd/... -v -timeout 60s -count=1

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Coverage floor (minimum 95.0%)
        run: |
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${TOTAL}%"
          if (( $(echo "$TOTAL < 95.0" | bc -l) )); then
            echo "::error::Coverage ${TOTAL}% is below 95.0% floor"
            exit 1
          fi
          echo "Coverage ${TOTAL}% meets floor"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./pkg/... ./cmd/... ./scripts/...

      - name: Gofmt check
        run: |
          UNFORMATTED=$(gofmt -l pkg/ cmd/ scripts/)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Files not formatted: $UNFORMATTED"
            exit 1
          fi

      - name: Gocyclo check
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          VIOLATIONS=$(gocyclo -over 25 pkg/ cmd/ scripts/)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Cyclomatic complexity > 25:"
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: Build
        run: go build ./pkg/... ./cmd/... ./scripts/...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify compiler state isolation
        run: go test -race ./pkg/codegen ./pkg/semantic ./pkg/lockfile -count=1 -timeout=180s

  runtime-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d luxo_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_PREFIX: luxo_test
      DATABASE_SSL: disable
      LUXO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/luxo_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify runtime concurrency safety
        run: go test -race ./pkg/lux/... -count=1 -timeout=240s

  performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out benchmark baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .tmp/base
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test performance gate
        run: GOWORK=off go test ./scripts/benchgate ./scripts/benchscope -count=1

      - name: Select affected benchmark packages
        id: benchmark_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          benchmark_packages() {
            find pkg -type f -name '*_test.go' -exec grep -l '^func Benchmark' {} + |
              while IFS= read -r file; do
                dirname "${file}"
              done |
              sort -u
          }
          mkdir -p .tmp/head
          git archive HEAD | tar -x -C .tmp/head
          (
            cd .tmp/base
            benchmark_packages
          ) > .tmp/base-benchmark-packages.txt
          (
            cd .tmp/head
            benchmark_packages
          ) > .tmp/head-benchmark-packages.txt
          comm -12 .tmp/base-benchmark-packages.txt .tmp/head-benchmark-packages.txt > .tmp/common-benchmark-packages.txt
          git -c core.quotePath=false diff --no-renames --name-only "${BASE_SHA}" HEAD > .tmp/changed-files.txt
          GOWORK=off go run ./scripts/benchscope \
            .tmp/base \
            .tmp/head \
            .tmp/changed-files.txt \
            .tmp/common-benchmark-packages.txt > .tmp/benchmark-packages.txt
          if [[ -s .tmp/benchmark-packages.txt ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "Affected benchmark packages:"
            cat .tmp/benchmark-packages.txt
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "No benchmarked package has production changes in its dependency graph."
          fi

      - name: Install pinned benchstat
        if: steps.benchmark_scope.outputs.run == 'true'
        env:
          GOBIN: ${{ github.workspace }}/.tmp/bin
        run: |
          mkdir -p "${GOBIN}"
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260825160852-19be9d8e6c70

      - name: Compile benchmark binaries
        if: steps.benchmark_scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p .tmp/bin/base .tmp/bin/head .tmp/test-tmp
          while IFS= read -r package; do
            binary="${package//\//-}.test"
            (
              cd .tmp/base
              GOWORK=off go test -trimpath -c "./${package}" -o "${GITHUB_WORKSPACE}/.tmp/bin/base/${binary}"
            )
            (
              cd .tmp/head
              GOWORK=off go test -trimpath -c "./${package}" -o "${GITHUB_WORKSPACE}/.tmp/bin/head/${binary}"
            )
          done < .tmp/benchmark-packages.txt

      - name: Run adaptive interleaved benchmark samples
        if: steps.benchmark_scope.outputs.run == 'true'
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/test-tmp
        run: |
          set -euo pipefail
          run_package() {
            local source_root="$1"
            local binary_root="$2"
            local output="$3"
            local package="$4"
            local binary="${package//\//-}.test"
            (
              cd "${source_root}/${package}"
              "${binary_root}/${binary}" \
                -test.run='^$' \
                -test.bench=. \
                -test.benchmem \
                -test.benchtime=200ms \
                -test.count=1 \
                -test.cpu=2
            ) >> "${output}"
          }
          run_group() {
            local group="$1"
            local base_output="${GITHUB_WORKSPACE}/.tmp/benchmark-${group}-base.txt"
            local head_output="${GITHUB_WORKSPACE}/.tmp/benchmark-${group}-head.txt"
            : > "${base_output}"
            : > "${head_output}"
            for sample in {1..10}; do
              while IFS= read -r package; do
                if (( sample % 2 == 1 )); then
                  run_package "${GITHUB_WORKSPACE}/.tmp/base" "${GITHUB_WORKSPACE}/.tmp/bin/base" "${base_output}" "${package}"
                  run_package "${GITHUB_WORKSPACE}/.tmp/head" "${GITHUB_WORKSPACE}/.tmp/bin/head" "${head_output}" "${package}"
                else
                  run_package "${GITHUB_WORKSPACE}/.tmp/head" "${GITHUB_WORKSPACE}/.tmp/bin/head" "${head_output}" "${package}"
                  run_package "${GITHUB_WORKSPACE}/.tmp/base" "${GITHUB_WORKSPACE}/.tmp/bin/base" "${base_output}" "${package}"
                fi
              done < "${GITHUB_WORKSPACE}/.tmp/benchmark-packages.txt"
            done
          }
          run_group primary
          .tmp/bin/benchstat -alpha 0.01 base=.tmp/benchmark-primary-base.txt head=.tmp/benchmark-primary-head.txt
          .tmp/bin/benchstat -alpha 0.01 -filter '.unit:(sec/op OR B/op OR allocs/op)' -format csv base=.tmp/benchmark-primary-base.txt head=.tmp/benchmark-primary-head.txt > .tmp/benchstat-primary.csv 2> .tmp/benchstat-primary-warnings.txt
          confirmation_required=$(GOWORK=off go run ./scripts/benchgate --requires-confirmation .tmp/benchstat-primary.csv)
          if [[ "${confirmation_required}" == "true" ]]; then
            echo "Primary samples found a regression candidate; running confirmation samples."
            run_group confirmation
            .tmp/bin/benchstat -alpha 0.01 base=.tmp/benchmark-confirmation-base.txt head=.tmp/benchmark-confirmation-head.txt
            .tmp/bin/benchstat -alpha 0.01 -filter '.unit:(sec/op OR B/op OR allocs/op)' -format csv base=.tmp/benchmark-confirmation-base.txt head=.tmp/benchmark-confirmation-head.txt > .tmp/benchstat-confirmation.csv 2> .tmp/benchstat-confirmation-warnings.txt
          else
            echo "Primary samples are clean; confirmation samples are unnecessary."
          fi

      - name: Enforce performance baseline
        if: steps.benchmark_scope.outputs.run == 'true'
        run: |
          if [[ -s .tmp/benchstat-confirmation.csv ]]; then
            GOWORK=off go run ./scripts/benchgate .tmp/benchstat-primary.csv .tmp/benchstat-confirmation.csv
          else
            GOWORK=off go run ./scripts/benchgate .tmp/benchstat-primary.csv
          fi

  external-go-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build Luxo CLI
        run: |
          mkdir -p .tmp
          go build -o .tmp/luxo ./cmd/luxo

      - name: Generate and compile an external project
        run: |
          cp -R tests/go-consumer .tmp/go-consumer
          cd .tmp/go-consumer
          ../luxo gen
          GOWORK=off go mod tidy
          GOWORK=off go test ./... -count=1

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fuzz Lexer
        run: go test ./pkg/lexer/ -fuzz=FuzzLexer -fuzztime=30s -timeout=120s

      - name: Fuzz Parser
        run: go test ./pkg/parser/ -fuzz=FuzzParser -fuzztime=30s -timeout=120s

      - name: Fuzz Semantic
        run: go test ./pkg/semantic/ -fuzz=FuzzAnalyzer -fuzztime=30s -timeout=120s

  sdk-ts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [client, react, vite-plugin]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: pnpm install --frozen-lockfile

      - name: Test and build package
        working-directory: packages/${{ matrix.package }}
        run: |
          pnpm test
          pnpm build

      - name: Type-check React package
        if: matrix.package == 'react'
        working-directory: packages/react
        run: pnpm typecheck

  sdk-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        working-directory: packages/dart
        run: dart pub get

      - name: Analyze SDK
        working-directory: packages/dart
        run: dart analyze --fatal-infos

      - name: Test SDK
        working-directory: packages/dart
        run: dart test

  sdk-kotlin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verify Gradle Wrapper
        working-directory: packages/kotlin
        run: |
          test "$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f1)" = "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d"
          ./gradlew --version

      - name: Test Kotlin SDK and Gradle plugin
        working-directory: packages/kotlin
        run: ./gradlew build :gradle-plugin:validatePlugins --no-daemon --warning-mode fail

      - name: Test external Kotlin consumer
        working-directory: tests/kotlin-consumer
        env:
          LUXO_INTROSPECTION_KEY: ci-fixture-key
        run: |
          set -euo pipefail
          python3 -m http.server 18080 --bind 127.0.0.1 --directory src/main/luxo &
          server_pid=$!
          trap 'kill "${server_pid}"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:18080/luxo.schema.json
          ../../packages/kotlin/gradlew luxoGenerate build --project-cache-dir .tmp/gradle-cache --no-daemon --warning-mode fail -Pluxo.endpoint=http://127.0.0.1:18080/luxo.schema.json
          grep -F '"lookupNode" to "name, posts { title }"' .tmp/generated/com/luxo/generated/SelectHints.kt
          if grep -R -F '!!' .tmp/generated/com/luxo/generated; then
            echo "::error::Generated Kotlin contains a non-null assertion"
            exit 1
          fi
          ../../packages/kotlin/gradlew luxoAnalyze --project-cache-dir .tmp/gradle-cache --configuration-cache --no-daemon --warning-mode fail
          ../../packages/kotlin/gradlew luxoAnalyze --project-cache-dir .tmp/gradle-cache --configuration-cache --no-daemon --warning-mode fail

  sdk-swift-conformance:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Swift SDK
        uses: actions/checkout@v7
        with:
          repository: light-speak/luxo-swift
          ref: main
          path: .tmp/luxo-swift
          persist-credentials: false

      - name: Verify Swift wire protocol compatibility
        env:
          LUXO_PROTOCOL_FIXTURE: ${{ github.workspace }}/pkg/lux/codec/testdata/protocol-v1.json
        run: swift test --package-path .tmp/luxo-swift --filter ProtocolConformanceTests
