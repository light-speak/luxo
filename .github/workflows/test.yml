name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-test-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.classification.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changes from the verified merge
        id: classification
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          TESTED_SHA: ${{ github.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          kind=full
          sha='^[0-9a-f]{40}$'
          if [[ "$CHECKOUT_OUTCOME" == success && "$TESTED_SHA" =~ $sha &&
                "$EVENT_BASE_SHA" =~ $sha && "$EVENT_HEAD_SHA" =~ $sha ]] &&
             parents=$(git rev-list --parents --max-count=1 HEAD) &&
             [[ "$parents" == "$TESTED_SHA $EVENT_BASE_SHA $EVENT_HEAD_SHA" ]] &&
             classifier=$(git show "${EVENT_BASE_SHA}:scripts/classify-ci-scope.sh" 2>/dev/null) &&
             result=$(git diff --raw --no-abbrev --no-renames --no-ext-diff --ignore-submodules=none -z \
               "$EVENT_BASE_SHA" "$TESTED_SHA" -- | bash -c "$classifier") &&
             [[ "$result" == benchmark-only ]]; then
            kind=benchmark-only
          fi
          printf 'kind=%s\n' "$kind" >> "$GITHUB_OUTPUT"
          printf 'Test scope: %s\n' "$kind"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d luxo_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_PREFIX: luxo_test
      DATABASE_SSL: disable
      LUXO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/luxo_test?sslmode=disable
      NATS_URL: nats://127.0.0.1:4222
      STORAGE_ENDPOINT: 127.0.0.1:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: luxo-ci-storage
      STORAGE_SECRET_KEY: luxo-ci-storage-secret
      STORAGE_BUCKET: luxo-ci-storage
      STORAGE_USE_SSL: "false"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Start NATS with JetStream and verify readiness
        run: |
          set -euo pipefail
          docker run --detach --name luxo-ci-nats \
            --publish 127.0.0.1:4222:4222 \
            --publish 127.0.0.1:8222:8222 \
            nats:2-alpine -js -m 8222
          curl --fail --silent --show-error --retry 20 --retry-all-errors \
            --retry-delay 1 --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:8222/healthz
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:8222/jsz | jq --exit-status \
            '.disabled != true and .config.max_memory > 0 and .config.max_storage > 0'

      - name: Checkout pinned MinIO source
        uses: actions/checkout@v7
        with:
          repository: minio/minio
          ref: 7aac2a2c5b7c882e68c1ce017d8256be2feea27f
          path: .tmp/minio-source
          persist-credentials: false

      - name: Build pinned MinIO test image
        run: |
          set -euo pipefail
          mkdir -p .tmp/minio-image
          (cd .tmp/minio-source && GOWORK=off CGO_ENABLED=0 go build -mod=readonly -p=2 -o ../minio-image/minio .)
          printf 'FROM scratch\nCOPY minio /minio\nENTRYPOINT ["/minio"]\n' > .tmp/minio-image/Dockerfile
          docker build --tag luxo-ci-minio:7aac2a2c5b7c882e68c1ce017d8256be2feea27f .tmp/minio-image

      - name: Start MinIO and verify readiness
        run: |
          set -euo pipefail
          docker run --detach --name luxo-ci-minio \
            --publish 127.0.0.1:9000:9000 \
            --memory 512m --cpus 1 --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /data:rw,size=128m \
            -e "MINIO_ROOT_USER=$STORAGE_ACCESS_KEY" \
            -e "MINIO_ROOT_PASSWORD=$STORAGE_SECRET_KEY" \
            luxo-ci-minio:7aac2a2c5b7c882e68c1ce017d8256be2feea27f \
            server /data
          curl --fail --silent --show-error --retry 20 --retry-all-errors \
            --retry-delay 1 --connect-timeout 2 --max-time 5 \
            "http://$STORAGE_ENDPOINT/minio/health/ready"

      - name: Configure local module graph
        uses: ./.github/actions/setup-modules

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          listed_packages=$(go list ./pkg/... ./cmd/... ./scripts/... ./internal/...)
          codegen_package=$(go list ./pkg/codegen)
          packages=()
          while IFS= read -r package; do
            if [[ "$package" != "$codegen_package" ]]; then
              packages+=("$package")
            fi
          done <<< "$listed_packages"
          go test -v -coverprofile=coverage.out -timeout=180s -count=1 "${packages[@]}"

      - name: Run CLI module tests
        run: go test ./cmd/luxo/... -v -timeout=5m -count=1

      - name: Check generated Go interoperability fixture
        run: go test ./tests/sdk-interop -count=1

      - name: Run code generator tests with coverage
        run: |
          set -euo pipefail
          go test ./pkg/codegen -v -coverprofile=codegen-coverage.out -timeout=75m -count=1
          IFS= read -r coverage_mode < coverage.out
          IFS= read -r codegen_mode < codegen-coverage.out
          test "$coverage_mode" = "$codegen_mode"
          tail -n +2 codegen-coverage.out >> coverage.out

      - name: Verify independent adapters against this core revision
        run: |
          go test -race ./pkg/lux/storage/s3/... -coverprofile=s3-coverage.out -count=1 -timeout=120s
          go test -race ./pkg/lux/cache/redis/... -coverprofile=redis-coverage.out -count=1 -timeout=120s
          go test -race ./pkg/lux/nats/... -coverprofile=nats-coverage.out -count=1 -timeout=120s
          go test -race ./pkg/lux/pg/... -coverprofile=pg-coverage.out -count=1 -timeout=15m

      - name: Coverage summary
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out | tail -1

      - name: Coverage floor (minimum 95.0%)
        run: |
          set -euo pipefail
          TOTAL=$(go tool cover -func=coverage.out | awk '
            $1 == "total:" {
              count++
              if (NF != 3 || $2 != "(statements)" || $3 !~ /^[0-9]+([.][0-9]+)?%$/) invalid = 1
              sub(/%$/, "", $3)
              total = $3 + 0
            }
            END {
              if (count != 1 || invalid || total < 0 || total > 100) exit 1
              print total
            }')
          echo "Total coverage: ${TOTAL}%"
          if ! awk -v total="$TOTAL" 'BEGIN { exit !(total >= 95.0) }'; then
            echo "::error::Coverage ${TOTAL}% is below 95.0% floor"
            exit 1
          fi
          echo "Coverage ${TOTAL}% meets floor"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out,s3-coverage.out,redis-coverage.out,nats-coverage.out,pg-coverage.out
          use_oidc: true
          fail_ci_if_error: true

      - name: Stop MinIO test container
        if: always()
        run: |
          docker logs luxo-ci-minio || true
          docker rm --force luxo-ci-minio || true

      - name: Stop NATS test container
        if: always()
        run: |
          docker logs luxo-ci-nats || true
          docker rm --force luxo-ci-nats || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure local module graph
        uses: ./.github/actions/setup-modules

      - name: Vet
        run: go vet ./pkg/... ./cmd/... ./cmd/luxo/... ./scripts/... ./internal/... ./pkg/lux/pg/... ./pkg/lux/nats/... ./pkg/lux/cache/redis/... ./pkg/lux/storage/s3/...


      - name: Gofmt check
        run: sh scripts/check-go.sh format pkg/ cmd/ scripts/ internal/

      - name: Gocyclo check
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          go version -m "$(command -v gocyclo)"
          sh scripts/check-go.sh complexity pkg/ cmd/ scripts/ internal/

      - name: Build
        run: go build ./pkg/... ./cmd/... ./cmd/luxo/... ./scripts/... ./internal/... ./pkg/lux/pg/... ./pkg/lux/nats/... ./pkg/lux/cache/redis/... ./pkg/lux/storage/s3/...

  race:
    needs: pr-test-scope
    if: ${{ !cancelled() && (needs.pr-test-scope.result != 'success' || needs.pr-test-scope.outputs.kind != 'benchmark-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure local module graph
        uses: ./.github/actions/setup-modules

      - name: Verify compiler state isolation
        env:
          GOFLAGS: -trimpath -race
        run: |
          go test ./pkg/semantic ./pkg/lockfile -count=1 -timeout=10m
          go test ./pkg/codegen -count=1 -timeout=95m

  runtime-race:
    needs: pr-test-scope
    if: ${{ !cancelled() && (needs.pr-test-scope.result != 'success' || needs.pr-test-scope.outputs.kind != 'benchmark-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d luxo_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_PREFIX: luxo_test
      DATABASE_SSL: disable
      LUXO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/luxo_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure local module graph
        uses: ./.github/actions/setup-modules

      - name: Verify runtime concurrency safety
        run: go test -race ./pkg/lux/... -count=1 -timeout=240s

  performance-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      run: ${{ steps.benchmark_scope.outputs.run }}
      matrix: ${{ steps.benchmark_plan.outputs.matrix }}
      artifact: ${{ steps.benchmark_plan.outputs.artifact }}
      base_sha: ${{ steps.benchmark_revisions.outputs.base_sha }}
      tested_sha: ${{ steps.benchmark_revisions.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve benchmark revisions
        id: benchmark_revisions
        env:
          TESTED_SHA: ${{ github.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          for sha in "$TESTED_SHA" "$EVENT_HEAD_SHA" "$EVENT_BASE_SHA"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid benchmark event revision" >&2
              exit 1
            fi
          done
          parents=$(git rev-list --parents --max-count=1 HEAD)
          read -r merge_sha base_sha pr_sha extra <<< "$parents"
          if [[ "$merge_sha" != "$TESTED_SHA" || -z "$base_sha" || "$pr_sha" != "$EVENT_HEAD_SHA" || -n "$extra" ]]; then
            echo "Benchmark checkout must be the event merge with the PR head as second parent" >&2
            exit 1
          fi
          # The event's base can predate the main revision used to build the merge.
          if ! git merge-base --is-ancestor "$EVENT_BASE_SHA" "$base_sha"; then
            echo "PR event base is not an ancestor of the tested merge base" >&2
            exit 1
          fi
          mkdir -p .tmp
          printf 'base_sha=%s\ntested_sha=%s\n' "$base_sha" "$merge_sha" > .tmp/benchmark-revisions.txt
          cat .tmp/benchmark-revisions.txt >> "$GITHUB_OUTPUT"

      - name: Check out benchmark baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.benchmark_revisions.outputs.base_sha }}
          path: .tmp/base
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test performance gate
        run: GOWORK=off go test ./scripts/benchgate ./scripts/benchscope ./scripts/benchplan ./scripts/benchrun ./internal/benchlayout -count=1

      - name: Select affected benchmark packages
        id: benchmark_scope
        env:
          BASE_SHA: ${{ steps.benchmark_revisions.outputs.base_sha }}
          TESTED_SHA: ${{ steps.benchmark_revisions.outputs.tested_sha }}
        run: |
          set -euo pipefail
          benchmark_packages() {
            find pkg -type f -name '*_test.go' -exec grep -l '^func Benchmark' {} + |
              while IFS= read -r file; do
                dirname "${file}"
              done |
              sort -u
          }
          test "$(git -C .tmp/base rev-parse HEAD)" = "$BASE_SHA"
          mkdir -p .tmp/head
          git archive "$TESTED_SHA" | tar -x -C .tmp/head
          sh scripts/setup-modules.sh .tmp/base
          sh scripts/setup-modules.sh .tmp/head
          mkdir -p .tmp/bin
          GOWORK=off go build -o .tmp/bin/benchrun ./scripts/benchrun
          (
            cd .tmp/base
            benchmark_packages
          ) | .tmp/bin/benchrun canonical > .tmp/base-benchmark-packages.txt
          (
            cd .tmp/head
            benchmark_packages
          ) | .tmp/bin/benchrun canonical > .tmp/head-benchmark-packages.txt
          comm -12 .tmp/base-benchmark-packages.txt .tmp/head-benchmark-packages.txt > .tmp/common-benchmark-packages.txt
          git -c core.quotePath=false diff --no-renames --name-only "${BASE_SHA}" "${TESTED_SHA}" > .tmp/changed-files.txt
          GOWORK=off go run ./scripts/benchscope \
            .tmp/base \
            .tmp/head \
            .tmp/changed-files.txt \
            .tmp/common-benchmark-packages.txt > .tmp/benchmark-packages.txt
          if [[ -s .tmp/benchmark-packages.txt ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "Affected benchmark packages:"
            cat .tmp/benchmark-packages.txt
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "No benchmarked package has production changes in its dependency graph."
          fi

      - name: Discover and plan benchmark batches
        id: benchmark_plan
        if: steps.benchmark_scope.outputs.run == 'true'
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/test-tmp
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/base/.tmp .tmp/head/.tmp
          mkdir -p .tmp/bin .tmp/test-tmp .tmp/benchmark-inventory/base .tmp/benchmark-inventory/head
          .tmp/bin/benchrun performance-profile > .tmp/benchmark-compile-profile.txt
          record_inventory() {
            local revision="$1" binaries="$2" package="$3" stem="$4" profile="${5:-default}" filter="${6:-.}"
            .tmp/bin/benchrun run-performance ".tmp/${revision}" "$binaries" "$package" "$profile" \
              -test.run='^$' -test.bench="$filter" -test.benchmem -test.benchtime=1x \
              -test.count=1 -test.cpu=2 -test.timeout=180s > "$stem.raw.log"
            GOWORK=off go run ./scripts/benchplan --normalize "$stem.raw.log" "$stem.log"
          }
          while IFS= read -r package; do
            for revision in base head; do
              stem=".tmp/benchmark-inventory/${revision}/${package//\//-}"
              compile=compile-performance
              if [[ "$revision" == base ]]; then
                compile=compile-performance-baseline
              fi
              .tmp/bin/benchrun "$compile" ".tmp/${revision}" ".tmp/bin/${revision}" "${package}"
              record_inventory "$revision" ".tmp/bin/${revision}" "$package" "$stem"
              if [[ "$package" == pkg/lux/rpc ]]; then
                .tmp/bin/benchrun compile ".tmp/${revision}" ".tmp/bin/ordinary-${revision}" "${package}"
                record_inventory "$revision" ".tmp/bin/ordinary-${revision}" "$package" "$stem.ordinary"
                GOWORK=off go run ./scripts/benchplan --verify-equal-inventories "$stem.ordinary.log" "$stem.log"
              fi
              specification=$(.tmp/bin/benchrun isolation-profile "$package")
              if [[ -n "$specification" ]]; then
                while IFS=$'\t' read -r profile filter extra; do
                  if [[ -z "$profile" || -z "$filter" || -n "$extra" ]]; then
                    printf 'Invalid benchmark isolation row for %s\n' "$package" >&2
                    exit 1
                  fi
                  .tmp/bin/benchrun "$compile" ".tmp/${revision}" ".tmp/bin/${revision}" "${package}" "$profile"
                  case "$profile" in
                    codec-reader) exclusive_root=BenchmarkElementPayload ;;
                    codegen-global-receiver) exclusive_root=BenchmarkGlobalReceiverName ;;
                    luvia-gateway-identity) exclusive_root=BenchmarkGatewayIdentity ;;
                    *) exclusive_root= ;;
                  esac
                  if [[ -n "$exclusive_root" ]]; then
                    .tmp/bin/benchrun run-performance ".tmp/${revision}" ".tmp/bin/${revision}" "$package" "$profile" \
                      -test.list='.*' > "$stem.$profile.roots"
                    test "$(cat "$stem.$profile.roots")" = "$exclusive_root"
                  fi
                  record_inventory "$revision" ".tmp/bin/${revision}" "$package" "$stem.$profile" "$profile" "$filter"
                  GOWORK=off go run ./scripts/benchplan --verify-profile-inventory "$package" "$profile" "$stem.log" "$stem.$profile.log"
                done <<< "$specification"
              fi
            done
          done < .tmp/benchmark-packages.txt
          matrix=$(GOWORK=off go run ./scripts/benchplan .tmp/benchmark-packages.txt .tmp/benchmark-inventory .tmp/benchmark-plan)
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "artifact=benchmark-plan-${RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Preserve benchmark plan and discovery evidence
        if: always() && steps.benchmark_scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-plan-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/benchmark-plan/
            .tmp/benchmark-inventory/
            .tmp/*benchmark-packages.txt
            .tmp/changed-files.txt
            .tmp/benchmark-revisions.txt
            .tmp/benchmark-compile-profile.txt

  performance-samples:
    needs: performance-scope
    if: needs.performance-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.performance-scope.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.performance-scope.outputs.tested_sha }}
          persist-credentials: false

      - name: Check out benchmark baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.performance-scope.outputs.base_sha }}
          path: .tmp/base
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Load benchmark batch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PLAN_ARTIFACT: ${{ needs.performance-scope.outputs.artifact }}
          SHARD: ${{ matrix.shard }}
          BASE_SHA: ${{ needs.performance-scope.outputs.base_sha }}
          TESTED_SHA: ${{ needs.performance-scope.outputs.tested_sha }}
        run: |
          set -euo pipefail
          test "$TESTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git -C .tmp/base rev-parse HEAD)" = "$BASE_SHA"
          download_stage=$(mktemp -d .tmp/benchmark-plan-download.XXXXXXXX)
          trap 'rm -rf -- "$download_stage"' EXIT
          for delay in 5 15 0; do
            download_dir="$download_stage/$delay"
            mkdir "$download_dir"
            download_status=0
            download_log=$(gh run download "${RUN_ID}" --name "${PLAN_ARTIFACT}" --dir "$download_dir" 2>&1) || download_status=$?
            if [[ -n "$download_log" ]]; then
              printf '%s\n' "$download_log" | sed -E 's@https?://[^[:space:])]+@<download URL>@g' >&2
            fi
            if (( download_status == 0 )); then break; fi
            if (( delay == 0 )); then exit "$download_status"; fi
            if [[ "$download_log" =~ (^|[[:space:]])HTTP[[:space:]]+([0-9]{3})([^[:digit:]]|$) ]]; then
              case "${BASH_REMATCH[2]}" in
                500|502|503|504) ;;
                *) exit "$download_status" ;;
              esac
            else
              case "$download_log" in
                *"i/o timeout"*|*"TLS handshake timeout"*|*"connection reset by peer"*) ;;
                *) exit "$download_status" ;;
              esac
            fi
            printf 'Retrying benchmark plan download in %ss.\n' "$delay" >&2
            sleep "$delay"
          done
          printf 'base_sha=%s\ntested_sha=%s\n' "$BASE_SHA" "$TESTED_SHA" > .tmp/benchmark-revisions.txt
          cmp .tmp/benchmark-revisions.txt "$download_dir/benchmark-revisions.txt"
          test ! -e .tmp/plan
          test ! -L .tmp/plan
          mv -- "$download_dir" .tmp/plan
          cp ".tmp/plan/benchmark-plan/shard-${SHARD}.tsv" .tmp/benchmark-batch.tsv
          cp ".tmp/plan/benchmark-plan/shard-${SHARD}.json" .tmp/benchmark-expected.json
          test -s .tmp/benchmark-batch.tsv
          mkdir -p .tmp/head
          git archive "$TESTED_SHA" | tar -x -C .tmp/head

      - name: Install pinned benchstat
        env:
          GOBIN: ${{ github.workspace }}/.tmp/bin
        run: |
          mkdir -p "${GOBIN}"
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260825160852-19be9d8e6c70

      - name: Compile benchmark binaries
        run: |
          set -euo pipefail
          mkdir -p .tmp/base/.tmp .tmp/head/.tmp
          mkdir -p .tmp/bin/base .tmp/bin/head .tmp/test-tmp
          sh scripts/setup-modules.sh .tmp/base
          sh scripts/setup-modules.sh .tmp/head
          GOWORK=off go build -o .tmp/bin/benchrun ./scripts/benchrun
          .tmp/bin/benchrun performance-profile > .tmp/benchmark-compile-profile.txt
          cmp .tmp/benchmark-compile-profile.txt .tmp/plan/benchmark-compile-profile.txt
          GOWORK=off go run ./scripts/benchplan --verify-profile-batch primary .tmp/benchmark-expected.json .tmp/benchmark-batch.tsv
          while IFS=$'\t' read -r package profile filter; do
            .tmp/bin/benchrun compile-performance-baseline .tmp/base .tmp/bin/base "${package}" "${profile}"
            .tmp/bin/benchrun compile-performance .tmp/head .tmp/bin/head "${package}" "${profile}"
          done < .tmp/benchmark-batch.tsv

      - name: Run adaptive interleaved benchmark samples
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/test-tmp
        run: |
          set -euo pipefail
          run_package() {
            local source_root="$1"
            local binary_root="$2"
            local output="$3"
            local package="$4"
            local profile="$5"
            local filter="$6"
            .tmp/bin/benchrun run-performance "${source_root}" "${binary_root}" "${package}" "${profile}" \
              -test.run='^$' -test.bench="${filter}" -test.benchmem \
              -test.benchtime=200ms -test.count=1 -test.cpu=2 >> "${output}"
          }
          run_group() {
            local group="$1"
            local batch="$2"
            local base_output="${GITHUB_WORKSPACE}/.tmp/benchmark-raw-${group}-base.txt"
            local head_output="${GITHUB_WORKSPACE}/.tmp/benchmark-raw-${group}-head.txt"
            : > "${base_output}"
            : > "${head_output}"
            for sample in {1..10}; do
              while IFS=$'\t' read -r package profile filter; do
                if (( sample % 2 == 1 )); then
                  run_package "${GITHUB_WORKSPACE}/.tmp/base" "${GITHUB_WORKSPACE}/.tmp/bin/base" "${base_output}" "${package}" "${profile}" "${filter}"
                  run_package "${GITHUB_WORKSPACE}/.tmp/head" "${GITHUB_WORKSPACE}/.tmp/bin/head" "${head_output}" "${package}" "${profile}" "${filter}"
                else
                  run_package "${GITHUB_WORKSPACE}/.tmp/head" "${GITHUB_WORKSPACE}/.tmp/bin/head" "${head_output}" "${package}" "${profile}" "${filter}"
                  run_package "${GITHUB_WORKSPACE}/.tmp/base" "${GITHUB_WORKSPACE}/.tmp/bin/base" "${base_output}" "${package}" "${profile}" "${filter}"
                fi
              done < "${batch}"
            done
            GOWORK=off go run ./scripts/benchplan --normalize "${base_output}" ".tmp/benchmark-${group}-base.txt"
            GOWORK=off go run ./scripts/benchplan --normalize "${head_output}" ".tmp/benchmark-${group}-head.txt"
          }
          run_group primary .tmp/benchmark-batch.tsv
          GOWORK=off go run ./scripts/benchplan --verify .tmp/benchmark-expected.json .tmp/benchmark-primary-base.txt .tmp/benchmark-primary-head.txt
          .tmp/bin/benchstat -alpha 0.01 base=.tmp/benchmark-primary-base.txt head=.tmp/benchmark-primary-head.txt
          .tmp/bin/benchstat -alpha 0.01 -filter '.unit:(sec/op OR B/op OR allocs/op)' -format csv base=.tmp/benchmark-primary-base.txt head=.tmp/benchmark-primary-head.txt > .tmp/benchstat-primary.csv 2> .tmp/benchstat-primary-warnings.txt
          GOWORK=off go run ./scripts/benchgate --confirmation-targets .tmp/benchstat-primary.csv > .tmp/benchmark-confirmation-targets.tsv
          if [[ -s .tmp/benchmark-confirmation-targets.tsv ]]; then
            echo "Primary samples found regression candidates. Running targeted confirmation samples."
            GOWORK=off go run ./scripts/benchplan --confirmation-plan .tmp/benchmark-expected.json .tmp/benchmark-confirmation-targets.tsv .tmp/benchmark-confirmation-batch.tsv .tmp/benchmark-confirmation-expected.json
            test -s .tmp/benchmark-confirmation-batch.tsv
            test -s .tmp/benchmark-confirmation-expected.json
            GOWORK=off go run ./scripts/benchplan --verify-profile-batch confirmation .tmp/benchmark-confirmation-expected.json .tmp/benchmark-confirmation-batch.tsv
            run_group confirmation .tmp/benchmark-confirmation-batch.tsv
            GOWORK=off go run ./scripts/benchplan --verify .tmp/benchmark-confirmation-expected.json .tmp/benchmark-confirmation-base.txt .tmp/benchmark-confirmation-head.txt
            .tmp/bin/benchstat -alpha 0.01 base=.tmp/benchmark-confirmation-base.txt head=.tmp/benchmark-confirmation-head.txt
            .tmp/bin/benchstat -alpha 0.01 -filter '.unit:(sec/op OR B/op OR allocs/op)' -format csv base=.tmp/benchmark-confirmation-base.txt head=.tmp/benchmark-confirmation-head.txt > .tmp/benchstat-confirmation.csv 2> .tmp/benchstat-confirmation-warnings.txt
          else
            echo "Primary samples are clean; confirmation samples are unnecessary."
          fi

      - name: Enforce performance baseline
        env:
          BASE_SHA: ${{ needs.performance-scope.outputs.base_sha }}
        run: |
          set -euo pipefail
          test -s .tmp/benchstat-primary.csv
          test -f .tmp/benchmark-confirmation-targets.tsv
          if [[ -s .tmp/benchmark-confirmation-targets.tsv ]]; then
            test -s .tmp/benchstat-confirmation.csv
            GOWORK=off go run ./scripts/benchgate --approved-costs scripts/benchgate/approved-costs.json --base-sha "${BASE_SHA}" --targeted-confirmation .tmp/benchstat-primary.csv .tmp/benchstat-confirmation.csv
          else
            test ! -s .tmp/benchstat-confirmation.csv
            GOWORK=off go run ./scripts/benchgate --approved-costs scripts/benchgate/approved-costs.json --base-sha "${BASE_SHA}" .tmp/benchstat-primary.csv
          fi

      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: performance-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/benchmark-*.txt
            .tmp/benchstat-*.csv
            .tmp/benchstat-*-warnings.txt
            .tmp/benchmark-batch.tsv
            .tmp/benchmark-expected.json
            .tmp/benchmark-confirmation-targets.tsv
            .tmp/benchmark-confirmation-batch.tsv
            .tmp/benchmark-confirmation-expected.json

  performance:
    needs: [performance-scope, performance-samples]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every selected benchmark batch
        env:
          SCOPE_RESULT: ${{ needs.performance-scope.result }}
          SAMPLES_RESULT: ${{ needs.performance-samples.result }}
          HAS_BENCHMARKS: ${{ needs.performance-scope.outputs.run }}
        run: |
          set -euo pipefail
          test "${SCOPE_RESULT}" = success
          if [[ "${HAS_BENCHMARKS}" == true ]]; then
            test "${SAMPLES_RESULT}" = success
          else
            test "${HAS_BENCHMARKS}" == false
            test "${SAMPLES_RESULT}" = skipped
          fi

  external-go-consumer:
    needs: pr-test-scope
    if: ${{ !cancelled() && (needs.pr-test-scope.result != 'success' || needs.pr-test-scope.outputs.kind != 'benchmark-only') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure local module graph
        uses: ./.github/actions/setup-modules

      - name: Build Luxo CLI
        run: |
          mkdir -p .tmp
          go build -o .tmp/luxo ./cmd/luxo

      - name: Generate and compile an external project
        run: |
          cp -R tests/go-consumer .tmp/go-consumer
          cd .tmp/go-consumer
          ../luxo gen
          GOWORK=off go mod tidy
          GOWORK=off go test ./... -count=1

  fuzz:
    needs: pr-test-scope
    if: ${{ !cancelled() && (needs.pr-test-scope.result != 'success' || needs.pr-test-scope.outputs.kind != 'benchmark-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Prepare fuzz diagnostics
        run: |
          set -euo pipefail
          mkdir -p .tmp/fuzz
          go version | tee .tmp/fuzz/toolchain.txt
          go env GOOS GOARCH >> .tmp/fuzz/toolchain.txt

      - name: Fuzz Lexer
        run: |
          set -euo pipefail
          go test ./pkg/lexer/ -run='^$' -fuzz='^FuzzLexer$' -fuzztime=2000000x -parallel=4 -timeout=180s 2>&1 | tee .tmp/fuzz/lexer.log

      - name: Fuzz Parser
        run: |
          set -euo pipefail
          go test ./pkg/parser/ -run='^$' -fuzz='^FuzzParser$' -fuzztime=2000000x -parallel=4 -timeout=180s 2>&1 | tee .tmp/fuzz/parser.log

      - name: Fuzz Semantic
        run: |
          set -euo pipefail
          go test ./pkg/semantic/ -run='^$' -fuzz='^FuzzAnalyzer$' -fuzztime=2000000x -parallel=4 -timeout=180s 2>&1 | tee .tmp/fuzz/semantic.log

      - name: Preserve fuzz diagnostics and failing inputs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-evidence-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .tmp/fuzz/
            pkg/lexer/testdata/fuzz/
            pkg/parser/testdata/fuzz/
            pkg/semantic/testdata/fuzz/

  sdk-ts:
    needs: pr-test-scope
    if: ${{ !cancelled() && (needs.pr-test-scope.result != 'success' || needs.pr-test-scope.outputs.kind != 'benchmark-only') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [client, react, vite-plugin]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Verify Node toolchain
        run: sh scripts/check-node.sh

      - uses: actions/setup-go@v7
        if: matrix.package == 'vite-plugin'
        with:
          go-version-file: go.mod

      - name: Bind candidate modules for generated SDK fixtures
        uses: ./.github/actions/setup-modules
        if: matrix.package == 'vite-plugin'

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: pnpm install --frozen-lockfile

      - name: Report JavaScript toolchain
        working-directory: packages/${{ matrix.package }}
        run: |
          node --version
          pnpm --version
          pnpm exec tsc --version

      - name: Build client dependency for SDK consumers
        if: matrix.package != 'client'
        working-directory: packages/client
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install generator dependencies for React tests
        if: matrix.package == 'react'
        working-directory: packages/vite-plugin
        run: pnpm install --frozen-lockfile

      - name: Test and build package
        working-directory: packages/${{ matrix.package }}
        run: |
          pnpm test
          pnpm build

      - name: Type-check SDK package
        working-directory: packages/${{ matrix.package }}
        run: pnpm typecheck

  sdk-dart:
    needs: pr-test-scope
    if: ${{ !cancelled() && (needs.pr-test-scope.result != 'success' || needs.pr-test-scope.outputs.kind != 'benchmark-only') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dart: ['3.13.0', '3.13.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart }}

      - name: Verify Dart toolchain
        env:
          DART_EXPECTED: ${{ matrix.dart }}
        run: |
          set -euo pipefail
          : "${DART_EXPECTED:?missing expected Dart version}"
          dart_version_output="$(dart --version 2>&1)"
          printf '%s\n' "${dart_version_output}"
          case "${dart_version_output}" in
            "Dart SDK version: ${DART_EXPECTED} (stable) "*) ;;
            *) printf '::error::Expected Dart %s stable\n' "${DART_EXPECTED}"; exit 1 ;;
          esac

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Bind candidate modules for generated SDK fixtures
        uses: ./.github/actions/setup-modules

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Verify Node toolchain
        run: sh scripts/check-node.sh

      - name: Install dependencies
        working-directory: packages/dart
        run: dart pub get

      - name: Analyze SDK
        working-directory: packages/dart
        run: dart analyze --fatal-infos

      - name: Test SDK
        working-directory: packages/dart
        run: dart test --concurrency=1

      - name: Test JavaScript and Wasm precision and WebSocket adapter
        working-directory: packages/dart
        run: >-
          dart test -p node -c dart2js -c dart2wasm -j 1
          test/int64_test.dart test/int64_codec_test.dart test/int64_json_test.dart
          test/socket_web_test.dart test/uint64_test.dart test/error_response_test.dart test/json_parameters_test.dart
          test/http_protocol_test.dart test/codec_metadata_test.dart test/codec_test.dart test/codec_text_test.dart
          test/unicode_test.dart

  sdk-kotlin:
    needs: pr-test-scope
    if: ${{ !cancelled() && (needs.pr-test-scope.result != 'success' || needs.pr-test-scope.outputs.kind != 'benchmark-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          check-latest: true
          cache: gradle

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Bind candidate modules for generated SDK fixtures
        uses: ./.github/actions/setup-modules

      - name: Verify Gradle Wrapper
        working-directory: packages/kotlin
        run: |
          test "$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f1)" = "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d"
          ./gradlew --version

      - name: Test Kotlin SDK and Gradle plugin
        working-directory: packages/kotlin
        run: ./gradlew build :gradle-plugin:validatePlugins --no-daemon --warning-mode fail

      - name: Test generated Kotlin client against Go
        run: go run ./tests/sdk-interop -run -- ./packages/kotlin/gradlew -p tests/sdk-interop/kotlin build --project-cache-dir .tmp/gradle-cache --no-daemon --warning-mode fail

      - name: Test Kotlin gateway responses, errors and stream terminals
        run: go run ./tests/sdk-interop -run -gateway -- ./packages/kotlin/gradlew -p tests/sdk-interop/kotlin build --project-cache-dir .tmp/gradle-cache --no-daemon --warning-mode fail

      - name: Test old Kotlin SDK against new enum services
        run: |
          go run ./tests/sdk-interop -run -enum-upgrade -- ./packages/kotlin/gradlew -p tests/sdk-interop/kotlin build --project-cache-dir .tmp/gradle-cache --no-daemon --warning-mode fail
          go run ./tests/sdk-interop -run -enum-upgrade -gateway -- ./packages/kotlin/gradlew -p tests/sdk-interop/kotlin build --project-cache-dir .tmp/gradle-cache --no-daemon --warning-mode fail

      - name: Test external Kotlin consumer
        working-directory: tests/kotlin-consumer
        env:
          LUXO_INTROSPECTION_KEY: ci-fixture-key
        run: |
          set -euo pipefail
          python3 -m http.server 18080 --bind 127.0.0.1 --directory src/main/luxo &
          server_pid=$!
          trap 'kill "${server_pid}"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:18080/luxo.schema.json
          ../../packages/kotlin/gradlew luxoGenerate build --project-cache-dir .tmp/gradle-cache --no-daemon --warning-mode fail -Pluxo.endpoint=http://127.0.0.1:18080/luxo.schema.json
          if grep -R -F '!!' .tmp/generated/com/luxo/generated; then
            echo "::error::Generated Kotlin contains a non-null assertion"
            exit 1
          fi
          ../../packages/kotlin/gradlew build --project-cache-dir .tmp/gradle-cache --configuration-cache --no-daemon --warning-mode fail
          ../../packages/kotlin/gradlew build --project-cache-dir .tmp/gradle-cache --configuration-cache --no-daemon --warning-mode fail

  sdk-swift-native:
    needs: pr-test-scope
    if: ${{ !cancelled() && (needs.pr-test-scope.result != 'success' || needs.pr-test-scope.outputs.kind != 'benchmark-only') }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LUXO_SWIFT_PATH: ${{ github.workspace }}/.tmp/luxo-swift
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Swift SDK
        uses: actions/checkout@v7
        with:
          repository: light-speak/luxo-swift
          ref: 40aa5cc7948a0b74cfc59bc97dfbbc85371f4705
          path: .tmp/luxo-swift
          persist-credentials: false

      - name: Verify Swift candidate version
        id: swift-version
        run: cmp VERSION .tmp/luxo-swift/VERSION

      - name: Verify Swift wire protocol compatibility
        env:
          LUXO_PROTOCOL_FIXTURE: ${{ github.workspace }}/pkg/lux/codec/testdata/protocol-v1.json
        run: swift test --package-path .tmp/luxo-swift --filter ProtocolConformanceTests

      - uses: actions/setup-go@v7
        id: swift-go
        if: ${{ !cancelled() && steps.swift-version.outcome == 'success' }}
        with:
          go-version-file: go.mod

      - name: Bind candidate modules for generated SDK fixtures
        id: swift-modules
        if: ${{ !cancelled() && steps.swift-go.outcome == 'success' }}
        uses: ./.github/actions/setup-modules

      - name: Verify generated Swift client against Go
        if: ${{ !cancelled() && steps.swift-modules.outcome == 'success' }}
        run: go run ./tests/sdk-interop -run -- bash tests/sdk-interop/swift/run.sh

      - name: Verify Swift gateway responses, error data and stream terminals
        if: ${{ !cancelled() && steps.swift-modules.outcome == 'success' }}
        run: go run ./tests/sdk-interop -run -gateway -- bash tests/sdk-interop/swift/run.sh

      - name: Verify old Swift SDK against new enum services directly
        if: ${{ !cancelled() && steps.swift-modules.outcome == 'success' }}
        run: go run ./tests/sdk-interop -run -enum-upgrade -- bash tests/sdk-interop/swift/run.sh

      - name: Verify old Swift SDK against new enum services through the gateway
        if: ${{ !cancelled() && steps.swift-modules.outcome == 'success' }}
        run: go run ./tests/sdk-interop -run -enum-upgrade -gateway -- bash tests/sdk-interop/swift/run.sh

  sdk-swift-conformance:
    needs: [pr-test-scope, sdk-swift-native]
    if: ${{ always() && (needs.pr-test-scope.result != 'success' || needs.pr-test-scope.outputs.kind != 'benchmark-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require all Swift native checks
        env:
          SWIFT_NATIVE_RESULT: ${{ needs.sdk-swift-native.result }}
        run: test "$SWIFT_NATIVE_RESULT" = success
