name: Diagnose PR 103 short codegen paths on the actual runner model

on:
  push:
    branches: [diagnostics/pr103-retained-emission]
    paths:
      - .github/workflows/diagnose-pr103-short-paths.yml
      - scripts/diagnose-pr103-short-paths.sh

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr103-retained-emission'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the exact formal performance parents
        run: >-
          git fetch --no-tags origin
          925f30ee1dcd45882b29130b8ed02836ed88317e
          dcf2ca3eb2193f2e060051dfe4d47c5277b19f5d
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Verify the real model and compare the matching fixture
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: 1
        run: bash scripts/diagnose-pr103-short-paths.sh run
      - name: Preserve source bindings and immutable raw measurements
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr103-short-paths-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr103-short-paths/
          if-no-files-found: error
          retention-days: 14
