name: Replay PR 91 timing failures by AMD EPYC model

on:
  push:
    branches: [diagnostics/pr91-amd-performance]
    paths:
      - .github/workflows/diagnose-pr91-amd-performance.yml
      - scripts/diagnose-pr91-amd-performance.sh

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr91-amd-performance'
    name: Replay PR 91 for ${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scope: [epyc-7763, epyc-9v74]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact source revisions
        run: >-
          git fetch --no-tags origin
          ca818da9bf89e82dc6f5bd2f539e4dfdd576a801
          679921d60ff6c03ba14c2e8ded529a1dd0dd7723
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Sample both comparisons on one native runner
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: 1
          REPLAY_SCOPE: ${{ matrix.scope }}
        run: bash scripts/diagnose-pr91-amd-performance.sh "$REPLAY_SCOPE"
      - name: Preserve source bindings and raw sample pairs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-pr91-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr91-amd-${{ matrix.scope }}/
          if-no-files-found: error
          retention-days: 14
