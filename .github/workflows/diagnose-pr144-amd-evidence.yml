name: Replay PR 144 benchmark evidence on native Linux

on:
  push:
    branches: [diagnostics/pr144-amd-evidence]
    paths:
      - '.github/workflows/diagnose-pr144-amd-evidence.yml'
      - 'scripts/diagnose-pr144-native.*'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr144-amd-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 79ca343d68b265be411d07166702497eba1cd008
          persist-credentials: false
      - name: Select an original native processor
        id: route
        env:
          RUNNER_KIND: ${{ runner.environment }}
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$RUNNER_KIND" = github-hosted
          test "$(uname -sm)" = 'Linux x86_64'
          model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')
          test -n "$model"
          case "$model" in
            'AMD EPYC 9V74 80-Core Processor') shard=09 ;;
            'AMD EPYC 9V45 96-Core Processor') shard=10 ;;
            *) shard=unmatched ;;
          esac
          mkdir -p .tmp/pr144-native-evidence
          printf 'slot=%s\nworkflow=%s\ncpu=%s\nshard=%s\n' "$SLOT" "$GITHUB_SHA" "$model" "$shard" > .tmp/pr144-native-evidence/runner-route.txt
          printf 'shard=%s\n' "$shard" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.route.outputs.shard != 'unmatched'
        with:
          ref: e9159f125064eccd6499ff5f9426f9c020f05dcc
          path: .tmp/base
          persist-credentials: false
      - uses: actions/checkout@v7
        if: steps.route.outputs.shard != 'unmatched'
        with:
          ref: ${{ github.sha }}
          path: .tmp/control
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: steps.route.outputs.shard != 'unmatched'
        with:
          go-version: '1.27.1'
          cache: false
      - name: Rebuild and compare the original benchmark arms
        if: steps.route.outputs.shard != 'unmatched'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_KIND: ${{ runner.environment }}
          TARGET_SHARD: ${{ steps.route.outputs.shard }}
        run: bash .tmp/control/scripts/diagnose-pr144-native.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pr144-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}
          path: .tmp/pr144-native-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Require a matching processor for qualification
        if: steps.route.outputs.shard == 'unmatched'
        run: exit 1
