name: Code Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get PR diff
        id: diff
        run: |
          DIFF=$(git diff origin/main...HEAD -- '*.go' | head -c 60000)
          if [ -z "$DIFF" ]; then
            echo "has_diff=false" >> $GITHUB_OUTPUT
          else
            echo "has_diff=true" >> $GITHUB_OUTPUT
            echo "$DIFF" > pr_diff.txt
          fi

      - name: Claude Code Review
        if: steps.diff.outputs.has_diff == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install anthropic -q

          python3 <<'PYEOF'
          import os
          import anthropic

          with open("pr_diff.txt") as f:
              diff = f.read()

          if not diff.strip():
              print("No changes")
              exit(0)

          prompt = f"""You are a senior Go engineer reviewing a PR for the Luxo project — a DSL-to-Go code generator framework.

          Review this diff for:
          1. **Bugs** — logic errors, nil pointer risks, race conditions
          2. **Performance** — unnecessary allocations, hot path issues
          3. **Security** — injection, unsafe patterns
          4. **Style** — Go idioms, naming, error handling

          Project rules:
          - Zero reflection in runtime/codegen paths
          - Zero unnecessary dependencies
          - Error handling: return error, never panic
          - Concurrent safety required

          Be concise. Only comment on real issues, not style preferences.
          If the code is good, say so briefly.

          ```diff
          {diff[:50000]}
          ```"""

          client = anthropic.Anthropic()
          response = client.messages.create(
              model="claude-sonnet-4-20250514",
              max_tokens=2000,
              messages=[{"role": "user", "content": prompt}]
          )

          review_text = response.content[0].text
          with open("review_output.md", "w") as f:
              f.write(review_text)
          print(review_text)
          PYEOF

      - name: Post review comment
        if: steps.diff.outputs.has_diff == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('review_output.md')) return;
            const review = fs.readFileSync('review_output.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Claude Code Review\n\n${review}`
            });
