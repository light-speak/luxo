name: Qualify pending beta comparisons on matching native processors

on:
  push:
    branches: [diagnostics/beta-native-qualification]

permissions:
  actions: read
  contents: read

jobs:
  native:
    if: github.repository == 'light-speak/luxo'
    name: native allocation ${{ matrix.allocation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        allocation: [1, 2]
    steps:
      - name: Select an original native processor
        id: route
        env:
          RUNNER_KIND: ${{ runner.environment }}
          ALLOCATION: ${{ matrix.allocation }}
          LC_ALL: C
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/beta-native-qualification"
          mkdir -p "$evidence"
          lscpu > "$evidence/lscpu.txt"
          actual=$(sed -n 's/^Model name:[[:space:]]*//p' "$evidence/lscpu.txt")
          printf 'allocation=%s\nimage=%s\nimage_version=%s\nactual=%s\nrouter_sha=%s\n' \
            "$ALLOCATION" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$actual" "$GITHUB_SHA" > "$evidence/routing.txt"
          if [[ "$RUNNER_KIND" != github-hosted || "$(uname -sm)" != 'Linux x86_64' ]]; then
            exit 3
          fi
          case "$actual" in
            'Intel(R) Xeon(R) 6975P-C')
              lane=allocation
              ref=36b9d02e9080f7f12eb5e8ba6ccca89247915b7e
              depth=1
              ;;
            'AMD EPYC 9V45 96-Core Processor')
              lane=codegen
              ref=28339729c6bcd4d4248743e202258d54c9c7b0b7
              depth=1
              ;;
            'AMD EPYC 9V74 80-Core Processor')
              lane=dart
              ref=8250b2ab76706e28fce4afe4ce23a37638526b9a
              depth=4
              ;;
            *) exit 3 ;;
          esac
          printf 'lane=%s\nref=%s\ndepth=%s\n' "$lane" "$ref" "$depth" | tee -a "$evidence/routing.txt" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.route.outputs.ref }}
          path: readiness
          fetch-depth: ${{ steps.route.outputs.depth }}
          persist-credentials: false
      - name: Prepare the selected readiness checkout
        working-directory: readiness
        env:
          PINNED_REF: ${{ steps.route.outputs.ref }}
          LANE: ${{ steps.route.outputs.lane }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_REF"
          route="$RUNNER_TEMP/beta-native-qualification"
          case "$LANE" in
            allocation) evidence=.tmp/pr143-allocation-evidence-6975 ;;
            codegen) evidence=.tmp/pr143-timing-evidence ;;
            dart) evidence=.tmp/dart-http-refresh-evidence ;;
            *) exit 3 ;;
          esac
          mkdir -p "$evidence"
          if [[ "$LANE" == dart ]]; then
            model=$(sed -n 's/^actual=//p' "$route/routing.txt")
            test "$model" = 'AMD EPYC 9V74 80-Core Processor'
            printf 'model=%s\nmatch=true\n' "$model" > "$evidence/routing.txt"
          else
            cp "$route/routing.txt" "$evidence/routing.txt"
          fi
      - uses: actions/checkout@v7
        if: steps.route.outputs.lane == 'allocation'
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/diagnostics/pr143-allocation-q2.patch.b64
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v7
        if: steps.route.outputs.lane != 'dart'
        with:
          go-version: '1.27.1'
          cache: false
      - uses: dart-lang/setup-dart@v1
        if: steps.route.outputs.lane == 'dart'
        with:
          sdk: '3.13.4'
      - uses: actions/setup-go@v7
        if: steps.route.outputs.lane == 'dart'
        with:
          go-version-file: readiness/go.mod
          cache: false
      - name: Bind the locked Dart arms and take paired samples
        if: steps.route.outputs.lane == 'dart'
        working-directory: readiness
        env:
          PINNED_REF: ${{ steps.route.outputs.ref }}
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_REF"
          mkdir -p .tmp/dart-http-refresh-evidence
          # The replay verifier binds its checkout via GITHUB_SHA. The outer run
          # SHA is recorded separately in runner.temp's routing receipt.
          GITHUB_SHA="$PINNED_REF" python3 -I -B .github/diagnostics/dart-http-refresh/qualify.py collect \
            --repo "$PWD" --scratch "$PWD/.tmp" \
            --evidence "$PWD/.tmp/dart-http-refresh-evidence" \
            | tee .tmp/dart-http-refresh-evidence/setup.jsonl
      - name: Verify and replay all ten original allocation leaves with Q2
        if: steps.route.outputs.lane == 'allocation'
        working-directory: readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LUXO_NATIVE_DIAGNOSTIC: pr143-allocation
          LC_ALL: C
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
          GOAMD64: v1
          Q2_TREE: b1e8c5c89474ea75834b265602595022e0ecbe5d
          Q2_PATCH_SHA: a498c3de5284f3c43eedf4886da909d8aa35f204d3f15b8a1a82506e268bcb42
        run: |
          set -euo pipefail
          controller="$GITHUB_WORKSPACE/controller"
          test "$(git -C "$controller" rev-parse HEAD)" = "$GITHUB_SHA"
          candidate="$controller/.github/diagnostics/pr143-allocation-q2.patch.b64"
          base64 --decode "$candidate" | sha256sum -c <(printf '%s  -\n' "$Q2_PATCH_SHA")
          driver=scripts/diagnose-pr143-allocation
          cp "$candidate" "$driver/entry-allocation.patch.b64"
          printf 'head_tree=%s\npatch_sum=%s\n' "$Q2_TREE" "$Q2_PATCH_SHA" >> "$driver/settings.sh"
          source "$driver/settings.sh"
          git fetch --no-tags --depth=1 origin "$product_base" "$patch_parent_commit" cbf4cfb383d944ceb38f700e19cf79c4c54d3c58
          scratch=$(mktemp -d "$PWD/.tmp/pr143-allocation-input.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45752445232/attempts/1" --jq \
            '{id,event,run_attempt,head_sha,pull_requests:[.pull_requests[]|{number,head:.head.sha,base:.base.sha}]}' > "$scratch/run.json"
          python3 -B scripts/diagnose-pr143-allocation/verify.py artifacts 6975 > "$scratch/refs.tsv"
          while IFS=$'\t' read -r shard artifact digest; do
            resource="repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
            gh api "$resource" > "$scratch/$shard.json"
            jq -e --arg sha "sha256:$digest" '.digest == $sha and (.expired | not)' "$scratch/$shard.json" > /dev/null
            gh api "$resource/zip" > "$scratch/$shard.zip"
          done < "$scratch/refs.tsv"
          bash scripts/diagnose-pr78-shutdown/run.sh 6975 "$scratch"
      - name: Replay the exact benchmark originals
        if: steps.route.outputs.lane == 'codegen'
        working-directory: readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: codegen
          LC_ALL: C
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
          GOAMD64: v1
        run: |
          set -euo pipefail
          base=f9ce659fd7f17bf57cfe0aee7de7ecb8d9b8f2e4
          head=1b6c73bd67a781beb9e8b783cc7f8f631bf1276e
          output="$PWD/.tmp/pr143-timing-evidence"
          scratch=$(mktemp -d "$PWD/.tmp/pr143-timing-input.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          git fetch --no-tags --depth=1 origin "$base" "$head"
          IFS=$'\t' read -r id digest _ < <(bash scripts/diagnose-pr143-timing/run.sh "$LANE" --artifact)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45752445232/attempts/1" > "$scratch/run.json"
          jq -e --arg head "$head" '.id == 45752445232 and .run_attempt == 1 and .head_sha == $head and .event == "workflow_dispatch"' "$scratch/run.json" > /dev/null
          resource="repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          gh api "$resource" > "$output/original-artifact.json"
          jq -e --arg sha "sha256:$digest" '.digest == $sha and (.expired | not) and .workflow_run.id == 45752445232' "$output/original-artifact.json" > /dev/null
          gh api "$resource/zip" > "$scratch/original.zip"
          bash scripts/diagnose-pr143-timing/run.sh "$LANE" "$PWD" "$scratch/original.zip" "$output"
      - uses: actions/checkout@v7
        if: ${{ !cancelled() && steps.route.outputs.lane == 'codegen' }}
        with:
          ref: 78f15da278fd12bc4db460c47f0a9a444f8c900a
          path: shutdown
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned shutdown checkout
        id: shutdown_ready
        if: ${{ !cancelled() && steps.route.outputs.lane == 'codegen' }}
        working-directory: shutdown
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 78f15da278fd12bc4db460c47f0a9a444f8c900a
          expected=$(python3 -B scripts/diagnose-pr78-shutdown/verify.py model 9v45)
          actual=$(sed -n 's/^Model name:[[:space:]]*//p' "$RUNNER_TEMP/beta-native-qualification/lscpu.txt")
          test "$actual" = "$expected"
          evidence=.tmp/pr78-shutdown-evidence-9v45
          mkdir -p "$evidence"
          printf 'lane=9v45\nactual=%s\nexpected=%s\nmatch=true\n' "$actual" "$expected" > "$evidence/routing.txt"
      - name: Replay pinned product and compare strictly
        if: ${{ !cancelled() && steps.route.outputs.lane == 'codegen' && steps.shutdown_ready.outcome == 'success' }}
        working-directory: shutdown
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          H2_LANE: 9v45
          LC_ALL: C
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
          GOAMD64: v1
        run: |
          set -euo pipefail
          inputs=$(mktemp -d "$PWD/.tmp/pr78-shutdown-input.XXXXXXXX")
          trap 'rm -rf -- "$inputs"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45227864247" --jq '
            {id,event,run_attempt,head_sha,
             pull_requests:[.pull_requests[]|{number,head:.head.sha,base:.base.sha}]}
          ' > "$inputs/run.json"
          python3 scripts/diagnose-pr78-shutdown/verify.py artifacts "$H2_LANE" > "$inputs/refs.tsv"
          while IFS=$'\t' read -r shard artifact digest; do
            resource="repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
            gh api "$resource" > "$inputs/$shard.json"
            jq -e --arg sha "sha256:$digest" '.digest == $sha and (.expired | not)' "$inputs/$shard.json" > /dev/null
            gh api "$resource/zip" > "$inputs/$shard.zip"
          done < "$inputs/refs.tsv"
          bash scripts/diagnose-pr78-shutdown/run.sh "$H2_LANE" "$inputs"
      - name: Preserve the routing, samples and controls
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: beta-native-pending-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.allocation }}
          path: |
            ${{ runner.temp }}/beta-native-qualification/
            readiness/.tmp/pr143-allocation-evidence-6975/
            readiness/.tmp/pr143-timing-evidence/
            readiness/.tmp/dart-http-refresh-evidence/
            shutdown/.tmp/pr78-shutdown-evidence-9v45/
          if-no-files-found: error
          retention-days: 14
