name: Qualify pending beta comparisons on EPYC 9V45

on:
  push:
    branches: [diagnostics/beta-native-qualification]

permissions:
  actions: read
  contents: read

jobs:
  native:
    if: github.repository == 'light-speak/luxo'
    name: native allocation ${{ matrix.allocation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        allocation: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Match the original EPYC 9V45 processor
        id: route
        env:
          RUNNER_KIND: ${{ runner.environment }}
          ALLOCATION: ${{ matrix.allocation }}
          LC_ALL: C
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/beta-native-qualification"
          mkdir -p "$evidence"
          lscpu > "$evidence/lscpu.txt"
          mapfile -t models < <(sed -n 's/^Model name:[[:space:]]*//p' "$evidence/lscpu.txt" | sed 's/[[:space:]]*$//')
          actual=${models[0]:-unknown}
          platform=$(uname -sm)
          printf 'allocation=%s\nimage=%s\nimage_version=%s\nactual=%s\nrunner_kind=%s\nplatform=%s\nrouter_sha=%s\n' \
            "$ALLOCATION" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$actual" "$RUNNER_KIND" "$platform" "$GITHUB_SHA" > "$evidence/routing.txt"
          if [[ "$RUNNER_KIND" != github-hosted || "$platform" != 'Linux x86_64' ]]; then
            printf 'lane=unmatched\nmatch=false\nreason=platform\n' >> "$evidence/routing.txt"
            exit 3
          fi
          if [[ "${#models[@]}" != 1 || "$actual" != 'AMD EPYC 9V45 96-Core Processor' ]]; then
            printf 'lane=unmatched\nmatch=false\nreason=processor\n' >> "$evidence/routing.txt"
            exit 3
          fi
          printf 'lane=9v45\nmatch=true\n' | tee -a "$evidence/routing.txt" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        id: control_checkout
        if: steps.route.outputs.match == 'true'
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: /.github/workflows/diagnose-beta-native-qualification.yml
          sparse-checkout-cone-mode: false
      - name: Bind the cumulative controller commit
        id: control
        if: steps.control_checkout.outcome == 'success'
        working-directory: controller
        env:
          ROUTER_PARENT: 5c672243495860f41e1cf697cc87d75e3eb9a2d6
        run: |
          set -euo pipefail
          workflow=.github/workflows/diagnose-beta-native-qualification.yml
          test "$GITHUB_REF" = refs/heads/diagnostics/beta-native-qualification
          read -r checked parent extra <<< "$(git rev-list --parents --max-count=1 HEAD)"
          test "$checked" = "$GITHUB_SHA"
          test "$parent" = "$ROUTER_PARENT"
          test -z "$extra"
          test "$(git diff --no-renames --name-only "$ROUTER_PARENT" HEAD --)" = "$workflow"
          tree=$(git rev-parse HEAD^{tree})
          blob=$(git rev-parse "HEAD:$workflow")
          printf 'router_parent=%s\nrouter_tree=%s\nrouter_workflow_blob=%s\n' \
            "$parent" "$tree" "$blob" >> "$RUNNER_TEMP/beta-native-qualification/routing.txt"
      - uses: actions/setup-go@v7
        id: go_setup
        if: steps.control.outcome == 'success'
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/checkout@v7
        id: scanner_checkout
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' }}
        with:
          ref: 28339729c6bcd4d4248743e202258d54c9c7b0b7
          path: readiness
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare the pinned scanner checkout
        id: scanner_ready
        if: ${{ !cancelled() && steps.scanner_checkout.outcome == 'success' }}
        working-directory: readiness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 28339729c6bcd4d4248743e202258d54c9c7b0b7
          evidence=.tmp/pr143-timing-evidence
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/beta-native-qualification/routing.txt" "$evidence/routing.txt"
      - name: Replay the exact benchmark originals
        if: ${{ !cancelled() && steps.scanner_ready.outcome == 'success' }}
        working-directory: readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: codegen
          LC_ALL: C
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
          GOAMD64: v1
        run: |
          set -euo pipefail
          base=f9ce659fd7f17bf57cfe0aee7de7ecb8d9b8f2e4
          head=1b6c73bd67a781beb9e8b783cc7f8f631bf1276e
          output="$PWD/.tmp/pr143-timing-evidence"
          scratch=$(mktemp -d "$PWD/.tmp/pr143-timing-input.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          git fetch --no-tags --depth=1 origin "$base" "$head"
          IFS=$'\t' read -r id digest _ < <(bash scripts/diagnose-pr143-timing/run.sh "$LANE" --artifact)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45752445232/attempts/1" > "$scratch/run.json"
          jq -e --arg head "$head" '.id == 45752445232 and .run_attempt == 1 and .head_sha == $head and .event == "workflow_dispatch"' "$scratch/run.json" > /dev/null
          resource="repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          gh api "$resource" > "$output/original-artifact.json"
          jq -e --arg sha "sha256:$digest" '.digest == $sha and (.expired | not) and .workflow_run.id == 45752445232' "$output/original-artifact.json" > /dev/null
          gh api "$resource/zip" > "$scratch/original.zip"
          bash scripts/diagnose-pr143-timing/run.sh "$LANE" "$PWD" "$scratch/original.zip" "$output"
      - uses: actions/checkout@v7
        id: shutdown_checkout
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' }}
        with:
          ref: 78f15da278fd12bc4db460c47f0a9a444f8c900a
          path: shutdown
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned shutdown checkout
        id: shutdown_ready
        if: ${{ !cancelled() && steps.shutdown_checkout.outcome == 'success' }}
        working-directory: shutdown
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 78f15da278fd12bc4db460c47f0a9a444f8c900a
          expected=$(python3 -B scripts/diagnose-pr78-shutdown/verify.py model 9v45)
          actual=$(sed -n 's/^actual=//p' "$RUNNER_TEMP/beta-native-qualification/routing.txt")
          test "$actual" = "$expected"
          evidence=.tmp/pr78-shutdown-evidence-9v45
          mkdir -p "$evidence"
          printf 'lane=9v45\nactual=%s\nexpected=%s\nmatch=true\n' "$actual" "$expected" > "$evidence/routing.txt"
      - name: Replay pinned product and compare strictly
        if: ${{ !cancelled() && steps.shutdown_ready.outcome == 'success' }}
        working-directory: shutdown
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          H2_LANE: 9v45
          LC_ALL: C
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
          GOAMD64: v1
        run: |
          set -euo pipefail
          inputs=$(mktemp -d "$PWD/.tmp/pr78-shutdown-input.XXXXXXXX")
          trap 'rm -rf -- "$inputs"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45227864247" --jq '
            {id,event,run_attempt,head_sha,
             pull_requests:[.pull_requests[]|{number,head:.head.sha,base:.base.sha}]}
          ' > "$inputs/run.json"
          python3 scripts/diagnose-pr78-shutdown/verify.py artifacts "$H2_LANE" > "$inputs/refs.tsv"
          while IFS=$'\t' read -r shard artifact digest; do
            resource="repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
            gh api "$resource" > "$inputs/$shard.json"
            jq -e --arg sha "sha256:$digest" '.digest == $sha and (.expired | not)' "$inputs/$shard.json" > /dev/null
            gh api "$resource/zip" > "$inputs/$shard.zip"
          done < "$inputs/refs.tsv"
          bash scripts/diagnose-pr78-shutdown/run.sh "$H2_LANE" "$inputs"
      - uses: actions/checkout@v7
        id: logging_checkout
        if: ${{ !cancelled() && steps.go_setup.outcome == 'success' }}
        with:
          ref: a053c33060c66d5612282d8f1bec8b8ce9bd2b4a
          path: logging
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare the pinned request logging checkout
        id: logging_ready
        if: ${{ !cancelled() && steps.logging_checkout.outcome == 'success' }}
        working-directory: logging
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a053c33060c66d5612282d8f1bec8b8ce9bd2b4a
          expected=$(python3 -B scripts/diagnose-pr83-f9/verify.py model 9v45)
          actual=$(sed -n 's/^actual=//p' "$RUNNER_TEMP/beta-native-qualification/routing.txt")
          test "$actual" = "$expected"
          evidence=.tmp/pr83-f9-evidence-9v45
          mkdir -p "$evidence"
          printf 'actual=%s\nexpected=%s\nmatch=true\n' "$actual" "$expected" > "$evidence/routing.txt"
      - name: Recheck PR 83 and its original failing workloads
        if: ${{ !cancelled() && steps.logging_ready.outcome == 'success' }}
        working-directory: logging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LUXO_NATIVE_DIAGNOSTIC: pr83-f9
          LC_ALL: C
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
          GOAMD64: v1
        run: |
          set -euo pipefail
          source scripts/diagnose-pr83-f9/settings.sh
          sampler=cbf4cfb383d944ceb38f700e19cf79c4c54d3c58
          for revision in "$product_base" "$sampler"; do
            git cat-file -e "$revision^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$revision"
          done
          inputs=$(mktemp -d "$PWD/.tmp/pr83-f9-input.XXXXXXXX")
          trap 'rm -rf -- "$inputs"' EXIT
          run_metadata() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1" --jq \
              '{id,event,run_attempt,head_sha,pull_requests:[.pull_requests[]|{number,head:.head.sha,base:.base.sha}]}'
          }
          run_metadata 45219367507 > "$inputs/run.json"
          run_metadata 45242193591 > "$inputs/diag-run.json"
          python3 -B scripts/diagnose-pr83-f9/verify.py artifacts 9v45 > "$inputs/refs.tsv"
          while IFS=$'\t' read -r shard artifact digest; do
            resource="repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
            gh api "$resource" > "$inputs/$shard.json"
            jq -e --arg sha "sha256:$digest" '.digest == $sha and (.expired | not)' "$inputs/$shard.json" > /dev/null
            gh api "$resource/zip" > "$inputs/$shard.zip"
          done < "$inputs/refs.tsv"
          bash scripts/diagnose-pr78-shutdown/run.sh 9v45 "$inputs"
      - name: Preserve the routing, samples and controls
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: beta-native-pending-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.allocation }}
          path: |
            ${{ runner.temp }}/beta-native-qualification/
            readiness/.tmp/pr143-timing-evidence/
            shutdown/.tmp/pr78-shutdown-evidence-9v45/
            logging/.tmp/pr83-f9-evidence-9v45/
          if-no-files-found: error
          retention-days: 14
