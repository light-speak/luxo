name: Attribute #158 HTTP/2 allocations on EPYC 7763

on:
  push:
    branches: [diagnostics/pr158-attribution]

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
          persist-credentials: false

      - name: Require the original EPYC 7763 runner CPU
        id: route
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          route=$(python3 -I -B scripts/diagnose-pr158/run.py --probe epyc)
          printf 'route=%s\n' "$route" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - uses: actions/checkout@v7
        with:
          ref: 59a4167f129f0bff0e8425125fa02eae87fd347b
          path: .tmp/pr158-base
          persist-credentials: false

      - name: Run the pinned EPYC timing matrix and then profile HTTP/2
        env:
          RUNNER_KIND: ${{ runner.environment }}
          NATIVE_ROUTE: ${{ steps.route.outputs.route }}
        run: python3 -I -B scripts/diagnose-pr158/run.py "$NATIVE_ROUTE"

      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr158-attribution-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/pr158-attribution
          if-no-files-found: error
          retention-days: 14
