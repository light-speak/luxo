name: Smoke-test the two isolated Luvia benchmark profiles

on:
  push:
    branches: [diagnostics/pr74-gateway-profile-smoke]
    paths:
      - .github/workflows/diagnose-pr74-gateway-profile-smoke.yml
      - scripts/diagnose-pr74-gateway-profile-smoke.sh

permissions:
  contents: read

jobs:
  inventory:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr74-gateway-profile-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Build and check ordinary Luvia plus both isolated profiles
        run: >-
          bash scripts/diagnose-pr74-gateway-profile-smoke.sh
          7be773a7b5fb90034988b5b3f6ca79816be7325d
          95555312e542300f7abb51bb0310f5d535b9fe4b
          e66bba79bfcb6b3d839773e26a59c6d36fe54bee
          62040115398eea2d0bee0bfce8f717f826be7bb3
          52b628ab5e8059d9a056a2f331fe44a277664116
          6e2a308013f8ca79c372a16e70dd8a6871c27470
      - name: Preserve normal test, native inventory and compiler evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr74-gateway-profile-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/pr74-gateway-profile-smoke/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
