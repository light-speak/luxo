name: Qualify the staged JWT scaffold safeguard

on:
  push:
    branches: [diagnostics/qualify-jwt-scaffold-go]
    paths:
      - .github/workflows/qualify-jwt-scaffold-go.yml
      - .github/qualification/jwt-scaffold.patch.b64

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/qualify-jwt-scaffold-go'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d luxo_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_PREFIX: luxo_test
      DATABASE_SSL: disable
      LUXO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/luxo_test?sslmode=disable
      LUXO_AUDIT_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/luxo_test?sslmode=disable
      LUXO_TRANSACTION_RACE: '1'
      NATS_URL: nats://127.0.0.1:4222
      GOTOOLCHAIN: local
      QUALIFICATION_BASE: ca818da9bf89e82dc6f5bd2f539e4dfdd576a801
      QUALIFICATION_TREE: f83536bbde073df4921b328787615901b38b0b24
      QUALIFICATION_PATCH_SHA256: db6c03192a8a39a53ad593ce5f6686cc8be03388566d8815f1922dead5454389

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false

      - name: Restore and verify the exact staged product tree
        run: |
          set -euo pipefail
          source="$PWD/.tmp/jwt-scaffold-go-source"
          evidence="$PWD/.tmp/jwt-scaffold-go-evidence"
          mkdir -p "$evidence"
          patch="$evidence/candidate.patch"
          base64 -d .github/qualification/jwt-scaffold.patch.b64 > "$patch"
          printf '%s  %s\n' "$QUALIFICATION_PATCH_SHA256" "$patch" | sha256sum -c
          test "$(git rev-parse "$QUALIFICATION_BASE^{tree}")" = ba252c7cace8908cdfcd7c203bc9dc11bb2ba746
          git worktree add --detach "$source" "$QUALIFICATION_BASE"
          git -C "$source" apply --index --check --whitespace=error "$patch"
          git -C "$source" apply --index --whitespace=error "$patch"
          git -C "$source" apply --reverse --check "$patch"
          git -C "$source" diff --cached --check
          test "$(git -C "$source" write-tree)" = "$QUALIFICATION_TREE"
          git -C "$source" diff --cached --name-only > "$evidence/paths.txt"
          printf '%s\n' pkg/codegen/init.go pkg/codegen/init_test.go pkg/lux/auth/jwt.go pkg/lux/auth/jwt_test.go pkg/lux/luvia/luvia_test.go pkg/lux/luvia/middleware.go pkg/lux/luvia/middleware_test.go | diff - "$evidence/paths.txt"
          printf '%s %s %s\n' "$QUALIFICATION_BASE" "$QUALIFICATION_TREE" "$QUALIFICATION_PATCH_SHA256" > "$evidence/revision.txt"
          go version > "$evidence/go-version.txt"
          test "$(cat "$evidence/go-version.txt")" = 'go version go1.27.1 linux/amd64'
          (cd "$source" && printf '%s\n' "0c80006d81f4debc53e314435afd75f5c581c737470e6a251d5ce8fc7ffd2c04  pkg/codegen/init.go" "5c629351eb44d8b04a355299048068c93c5489c939b8f72ea599fd01c5836cf4  pkg/codegen/init_test.go" "394eb180e453d15384a775ac0e63e5c41d72d35ca96d183c5ec0df2e228f8e04  pkg/lux/auth/jwt.go" "8fdc21241b129f3a51c9b6a24ca25f56f1f708051d638789e6de42ea504ef60d  pkg/lux/auth/jwt_test.go" "9c7198c196e605685c39cb2b8821e61cf6803c3b9c522edb9590e5aab77345c9  pkg/lux/luvia/luvia_test.go" "6a046a328453f70ce09939fc509c6b6ef623ef9145aaa8c22dd4fb530c2d5b7d  pkg/lux/luvia/middleware.go" "c8d5da22f396349cffd58cea64feabbaff7f57d4f116aaee46954e14aca610a3  pkg/lux/luvia/middleware_test.go" | sha256sum -c)
          test -z "$(gofmt -s -l "$source/pkg/codegen/init.go" "$source/pkg/codegen/init_test.go" "$source/pkg/lux/auth/jwt.go" "$source/pkg/lux/auth/jwt_test.go" "$source/pkg/lux/luvia/luvia_test.go" "$source/pkg/lux/luvia/middleware.go" "$source/pkg/lux/luvia/middleware_test.go")"
          sh "$source/scripts/setup-modules.sh" "$source"

      - name: Start the owned JetStream fixture
        run: |
          set -euo pipefail
          owner="luxo-qualify-jwt-scaffold-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "$owner" --label "org.luxo.audit.owner=$owner" \
            --publish 127.0.0.1:4222:4222 --publish 127.0.0.1:8222:8222 \
            nats:2.15.3-alpine -js -m 8222
          curl --fail --silent --show-error --retry 20 --retry-all-errors \
            --retry-delay 1 --connect-timeout 2 --max-time 5 http://127.0.0.1:8222/healthz
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:8222/jsz | jq --exit-status \
            '.disabled != true and .config.max_memory > 0 and .config.max_storage > 0'

      - name: Verify root packages with coverage and the CLI race suite
        run: |
          set -euo pipefail
          evidence="$PWD/.tmp/jwt-scaffold-go-evidence"
          cd .tmp/jwt-scaffold-go-source
          export GOWORK="$PWD/go.work"
          root=0
          go test -p 2 ./pkg/... -cover -coverprofile="$evidence/root.coverage" -count=1 -timeout=95m -json \
            > "$evidence/root.jsonl" 2>&1 || root=$?
          printf 'root %s\n' "$root" >> "$evidence/phases.txt"
          if (( root != 0 )); then tail -n 80 "$evidence/root.jsonl"; exit "$root"; fi
          cli=0
          go test -p 2 -race ./cmd/luxo/... -coverprofile="$evidence/cli.coverage" -count=1 -timeout=15m -json \
            > "$evidence/cli.jsonl" 2>&1 || cli=$?
          printf 'cli %s\n' "$cli" >> "$evidence/phases.txt"
          if (( cli != 0 )); then tail -n 80 "$evidence/cli.jsonl"; exit "$cli"; fi
          go tool cover -func="$evidence/root.coverage" > "$evidence/root.coverage-summary"
          grep -E '/pkg/lux/auth/jwt.go:[0-9]+:[[:space:]]+loadConfigFromEnv[[:space:]]+100[.]0%' \
            "$evidence/root.coverage-summary"
          grep -E '/pkg/lux/luvia/middleware.go:[0-9]+:[[:space:]]+extractBearerToken[[:space:]]+100[.]0%' \
            "$evidence/root.coverage-summary"
          go vet -p 2 ./pkg/... ./cmd/... ./cmd/luxo/... > "$evidence/vet.log" 2>&1
          git diff --exit-code
          test "$(git write-tree)" = "$QUALIFICATION_TREE"

      - name: Remove the owned source and JetStream fixture
        if: always()
        run: |
          set -euo pipefail
          owner="luxo-qualify-jwt-scaffold-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ids=$(docker ps -aq --filter "label=org.luxo.audit.owner=$owner")
          if [[ -n "$ids" ]]; then
            while IFS= read -r id; do docker rm -fv "$id"; done <<< "$ids"
          fi
          test -z "$(docker ps -aq --filter "label=org.luxo.audit.owner=$owner")"
          test -z "$(docker volume ls -q --filter "label=org.luxo.audit.owner=$owner")"
          if [[ -d .tmp/jwt-scaffold-go-source ]]; then
            git worktree remove --force .tmp/jwt-scaffold-go-source
          fi

      - name: Preserve exact coverage and test logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jwt-scaffold-go-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/jwt-scaffold-go-evidence/
          if-no-files-found: error
          retention-days: 14
