name: Compare PostgreSQL recorded recovery catalog lookups

on:
  push:
    branches: [diagnostics/hosted-pg-durable-0a6b]
    paths:
      - .github/workflows/diagnose-pg-durable.yml
      - scripts/diagnostics/pg-durable-hosted/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-pg-durable-0a6b
  cancel-in-progress: false

jobs:
  pg-durable:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-pg-durable-0a6b'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Fetch the exact common product source
        run: |
          set -euo pipefail
          base=15765dee6705d39de0b5a505d3039d59ebf43584
          git fetch --depth=1 --no-tags origin "$base"
          test "$(git rev-parse FETCH_HEAD)" = "$base"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Measure standalone DDL and record reconciliation in independent batches
        timeout-minutes: 40
        run: python3 -I -B scripts/diagnostics/pg-durable-hosted/hosted.py run
      - name: Confirm task-owned PostgreSQL resources returned to zero
        if: always()
        run: python3 -I -B scripts/diagnostics/pg-durable-hosted/hosted.py cleanup
      - name: Preserve raw samples and cleanup receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-pg-durable-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/pg-durable-hosted-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Remove the uploaded runner evidence
        if: always()
        run: python3 -I -B scripts/diagnostics/pg-durable-hosted/hosted.py remove-evidence
