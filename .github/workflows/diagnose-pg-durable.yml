name: Compare PostgreSQL combined migration costs

on:
  push:
    branches: [diagnostics/hosted-pg-durable-0a6b]
    paths:
      - .github/workflows/diagnose-pg-durable.yml
      - scripts/diagnostics/pg-durable-hosted/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-pg-durable-0a6b
  cancel-in-progress: false

jobs:
  pg-durable:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-pg-durable-0a6b'
    name: pg-durable (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        lane: [retry, lifecycle]
    env:
      LUXO_PG_DURABLE_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Fetch the exact baseline and candidate merge parents
        run: |
          set -euo pipefail
          base=15765dee6705d39de0b5a505d3039d59ebf43584
          main=5017b587f4cf71d30ebba8b542267aed597bb573
          review=411917fe2460a89b60233db8ab85fd7c83ab3955
          merge_base=f83f9c78f9ee03a5d73b7d0a41bae5280a250bfd
          git fetch --depth=1 --no-tags origin "$base" "$main" "$review" "$merge_base"
          for commit in "$base" "$main" "$review" "$merge_base"; do
            test "$(git rev-parse --verify "$commit^{commit}")" = "$commit"
          done
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Measure the bound migration path
        timeout-minutes: 40
        run: python3 -I -B scripts/diagnostics/pg-durable-hosted/hosted.py run
      - name: Confirm task-owned PostgreSQL resources returned to zero
        if: always()
        run: python3 -I -B scripts/diagnostics/pg-durable-hosted/hosted.py cleanup
      - name: Preserve raw samples and cleanup receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-pg-durable-history-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/pg-durable-hosted-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Remove the uploaded runner evidence
        if: always()
        run: python3 -I -B scripts/diagnostics/pg-durable-hosted/hosted.py remove-evidence
