name: Measure PostgreSQL durable migration costs

on:
  push:
    branches: [diagnostics/hosted-pg-durable-fedd]
    paths:
      - .github/workflows/diagnose-pg-durable.yml
      - scripts/diagnostics/pg-durable-hosted/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-pg-durable-fedd
  cancel-in-progress: false

jobs:
  pg-durable:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-pg-durable-fedd'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Measure the original and reconciliation boundaries
        timeout-minutes: 33
        run: python3 -I -B scripts/diagnostics/pg-durable-hosted/hosted.py run
      - name: Confirm task-owned PostgreSQL resources returned to zero
        if: always()
        run: python3 -I -B scripts/diagnostics/pg-durable-hosted/hosted.py cleanup
      - name: Preserve raw samples and cleanup receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-pg-durable-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/pg-durable-hosted-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Remove the uploaded runner evidence
        if: always()
        run: python3 -I -B scripts/diagnostics/pg-durable-hosted/hosted.py remove-evidence
