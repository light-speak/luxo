name: Rebuild the exact PR 72 reference layout

on:
  push:
    branches: [diagnostics/pr72-reference-layout]
    paths:
      - .github/workflows/diagnose-pr72-reference-layout.yml
      - scripts/diagnose-pr72-reference-layout.py
      - scripts/diagnose-frozen-fixtures.sh

permissions:
  contents: read

jobs:
  layout:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr72-reference-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Fetch the exact inputs from the original build
        run: >-
          git fetch --no-tags origin
          ca818da9bf89e82dc6f5bd2f539e4dfdd576a801
          5e4c9d1b3813cc95f98d4088a10c242dca47b8de
      - name: Verify the disassembly reader
        run: python3 scripts/diagnose-pr72-reference-layout.py --self-test
      - name: Rebuild exact frozen executables and compare instructions
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: 1
        run: |
          git diff --exit-code eb735edc90c7caa810262b77e5f7a9a6a659976a -- \
            scripts/benchrun scripts/diagnose-hosted-perf.sh scripts/setup-modules.sh \
            internal/benchlayout .github/qualification/pr72-array-header-unroll.patch.b64
          bash scripts/diagnose-frozen-fixtures.sh pr72-array-header --layout-only
      - name: Preserve binary bindings and reference disassembly
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr72-reference-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr72-reference-layout/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
