name: Attribute PR 74 JWT and scalar performance independently

on:
  workflow_dispatch:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-pr74-jwt-scalar.yml
      - scripts/diagnose-pr74-jwt-scalar.sh
      - scripts/diagnose-pr74-jwt-scalar.py
      - scripts/diagnose-pr74-jwt-scalar/**

permissions:
  contents: read

concurrency:
  group: hosted-pr74-jwt-scalar
  cancel-in-progress: false

jobs:
  diagnose-pr74-jwt-scalar:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Replay the four exact trees on one native runner
        timeout-minutes: 29
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: '1'
        run: bash scripts/diagnose-pr74-jwt-scalar.sh
      - name: Preserve samples, source binding, and verdicts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-pr74-jwt-scalar-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr74-jwt-scalar/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove the evidence directory after upload
        if: always()
        run: |
          test ! -L .tmp
          rm -rf -- .tmp/hosted-pr74-jwt-scalar
