name: Diagnose PR 72 shard 11 attempt 2 timing

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-pr72-shard11.yml
      - scripts/diagnose-pr72-shard11.sh

permissions:
  contents: read

concurrency:
  group: hosted-pr72-shard11-attempt2
  cancel-in-progress: false

jobs:
  diagnose-pr72-shard11:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Collect default-link A/A and A/B measurements
        timeout-minutes: 13
        env:
          GOTOOLCHAIN: local
        run: bash scripts/diagnose-pr72-shard11.sh
      - name: Preserve raw measurements, source hashes and binary layout
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-pr72-shard11-attempt2-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr72-shard11-attempt2/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove local evidence after upload
        if: always()
        run: rm -rf -- .tmp/hosted-pr72-shard11-attempt2
