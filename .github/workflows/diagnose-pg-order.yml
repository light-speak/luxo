name: Diagnose PostgreSQL migration order performance

on:
  push:
    branches: [diagnostics/hosted-pg-order-e101]
    paths:
      - .github/workflows/diagnose-pg-order.yml
      - scripts/diagnostics/pg-order-hosted/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-pg-order-e101
  cancel-in-progress: false

jobs:
  pg-order:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-pg-order-e101'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Verify inputs and measure on one native runner
        timeout-minutes: 32
        run: python3 -I -B scripts/diagnostics/pg-order-hosted/hosted.py run
      - name: Confirm only this job's PostgreSQL container and volume are absent
        if: always()
        run: python3 -I -B scripts/diagnostics/pg-order-hosted/hosted.py cleanup
      - name: Preserve PostgreSQL provenance, phases, and raw pair results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-pg-order-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/pg-order-hosted-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Remove the uploaded job evidence
        if: always()
        run: python3 -I -B scripts/diagnostics/pg-order-hosted/hosted.py remove-evidence
