name: Recheck #154 binary error envelope on EPYC 9V74

on:
  push:
    branches: [diagnostics/pr154-envelope-9v74]

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
          persist-credentials: false

      - id: route
        name: Require the original EPYC 9V74 processor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/pr154-envelope
          cpu=$(awk -F ': *' '/^model name[[:space:]]*:/ {sub(/[[:space:]]+$/, "", $2); print $2; exit}' /proc/cpuinfo)
          printf '%s\n' "$cpu" > .tmp/pr154-envelope/cpu.txt
          if [[ "$cpu" == "AMD EPYC 9V74 80-Core Processor" ]]; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
            echo "CPU did not match; no benchmark binaries or samples were produced." > .tmp/pr154-envelope/status.txt
          fi

      - if: steps.route.outputs.matched == 'true'
        uses: actions/checkout@v7
        with:
          ref: eaf2aac9e920135babd24b58f2a2e800ebdc44e8
          path: .tmp/base
          persist-credentials: false

      - if: steps.route.outputs.matched == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - if: steps.route.outputs.matched == 'true'
        name: Verify exact ELF and replay four original leaves
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: bash scripts/diagnose-pr154-envelope/run.sh

      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr154-envelope-9v74-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/pr154-envelope
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
