name: Diagnose PR 79 and 81 transport timing

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-pr79-pr81.yml
      - scripts/diagnose-pr79-pr81.sh
      - scripts/diagnose-pr79-pr81-scope.json
      - scripts/diagnose-pr79-pr81-tls.go.txt

permissions:
  contents: read

concurrency:
  group: hosted-pr79-pr81
  cancel-in-progress: false

jobs:
  diagnose-pr79-pr81:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [pr79, pr81]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Collect default-link A/A and A/B measurements
        timeout-minutes: 13
        env:
          GOTOOLCHAIN: local
          BENCHMARK_SUITE: ${{ matrix.suite }}
        run: bash scripts/diagnose-pr79-pr81.sh "$BENCHMARK_SUITE"
      - name: Preserve raw measurements, source hashes and binary layout
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-pr79-pr81-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr79-pr81-${{ matrix.suite }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove local evidence after upload
        if: always()
        run: rm -rf -- .tmp/hosted-pr79-pr81-${{ matrix.suite }}
