name: Recheck #84 unqualified API benchmarks on their original runner models

on:
  push:
    branches: [diagnostics/pr84-original-layout, 'diagnostics/pr84-original-layout-*']

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Match an original runner CPU before setup or build
        id: route
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          python3 -I -B scripts/diagnose-pr83-pr84-intel/run.py --probe

      - if: steps.route.outputs.shard != ''
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false

      - if: steps.route.outputs.shard != ''
        uses: actions/checkout@v7
        with:
          ref: 43dd9d4e5eb8fb59573fd3bdfd7de7b5b6814879
          path: .tmp/pr84-native-inputs/A
          persist-credentials: false

      - if: steps.route.outputs.shard != ''
        uses: actions/checkout@v7
        with:
          ref: 9c174866c68a8cbd241720cbf2c13c1ea8d4c9f4
          path: .tmp/pr84-native-inputs/H
          fetch-depth: 2
          persist-credentials: false

      - if: steps.route.outputs.shard != ''
        name: Run the original comparison followed by the matched fixture projection
        env:
          RUNNER_KIND: ${{ runner.environment }}
          ORIGINAL_SHARD: ${{ steps.route.outputs.shard }}
        run: python3 -I -B scripts/diagnose-pr83-pr84-intel/run.py "$ORIGINAL_SHARD"

      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr84-original-layout-${{ github.run_id }}-${{ github.run_attempt }}-slot-${{ matrix.slot }}
          path: .tmp/pr84-native-evidence
          if-no-files-found: error
          retention-days: 14

  qualification:
    needs: [witness]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/diagnose-pr83-pr84-intel
          persist-credentials: false

      - name: Report strict results and any original CPU models still missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          results=$(mktemp -d .tmp/pr84-native-receipts.XXXXXXXX)
          trap 'rm -rf -- "$results"' EXIT
          gh run download "$GITHUB_RUN_ID" --pattern "pr84-original-layout-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-slot-*" --dir "$results"
          python3 -I -B scripts/diagnose-pr83-pr84-intel/run.py --summarize "$results"
