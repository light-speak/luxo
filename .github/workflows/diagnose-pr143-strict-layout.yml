name: Replay PR 143 strict timings on original CPUs

on:
  push:
    branches: [diagnostics/pr143-strict-layout]
    paths:
      - '.github/workflows/diagnose-pr143-strict-layout.yml'
      - 'scripts/diagnose-pr143-strict-native.*'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr143-strict-layout'
    name: Native strict replay (slot ${{ matrix.slot }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Select the original shard for this hosted CPU
        id: route
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          actual=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | sed 's/[[:space:]]*$//')
          shard=
          if [[ "$RUNNER_KIND" == github-hosted && "$(uname -sm)" == 'Linux x86_64' ]]; then
            case "$actual" in
              'AMD EPYC 9V45 96-Core Processor') shard=06 ;;
              'INTEL(R) XEON(R) PLATINUM 8573C') shard=07 ;;
            esac
          fi
          match=false
          if [[ -n "$shard" ]]; then match=true; fi
          mkdir -p .tmp/pr143-strict-evidence
          printf 'workflow=%s\nslot=%s\nshard=%s\nactual=%s\nmatch=%s\n' \
            "$GITHUB_SHA" "$SLOT" "$shard" "$actual" "$match" > .tmp/pr143-strict-evidence/runner-route.txt
          printf 'match=%s\nshard=%s\n' "$match" "$shard" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.route.outputs.match == 'true'
        with:
          ref: ${{ github.sha }}
          path: .tmp/control
          fetch-depth: 3
          persist-credentials: false

      - uses: actions/checkout@v7
        if: steps.route.outputs.match == 'true'
        with:
          ref: 36681c63627f4a3a4805bc6d19e908325614d3e9
          path: .tmp/base
          persist-credentials: false

      - uses: actions/checkout@v7
        if: steps.route.outputs.match == 'true'
        with:
          ref: 27fddbeee9a994e1ea1330df9b53b36d501c8652
          path: .tmp/head-git
          persist-credentials: false

      - uses: actions/setup-go@v7
        if: steps.route.outputs.match == 'true'
        with:
          go-version: '1.27.1'
          cache: false

      - name: Rebuild and sample the original confirmation batch
        if: steps.route.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_KIND: ${{ runner.environment }}
          TARGET_SHARD: ${{ steps.route.outputs.shard }}
        run: bash .tmp/control/scripts/diagnose-pr143-strict-native.sh

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pr143-strict-${{ steps.route.outputs.shard || 'unmatched' }}-${{ github.run_id }}-${{ github.run_attempt }}-slot${{ matrix.slot }}
          path: .tmp/pr143-strict-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Report a processor mismatch after preserving the routing receipt
        if: ${{ always() && steps.route.outputs.match == 'false' }}
        run: exit 3
