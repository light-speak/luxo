name: Attribute PR 143 gateway identity on the current main

on:
  push:
    branches: [diagnostics/pr143-gateway-current]
    paths:
      - '.github/workflows/diagnose-pr143-strict-layout.yml'
      - 'scripts/diagnose-pr143-strict-native.*'

permissions:
  contents: read

jobs:
  replay:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr143-gateway-current'
    name: Gateway identity alignment (${{ matrix.slot }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    steps:
      - name: Require the original 6975P-C hosted CPU
        id: route
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          expected='Intel(R) Xeon(R) 6975P-C'
          actual=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | sed 's/[[:space:]]*$//')
          match=false
          if [[ "$RUNNER_KIND" == github-hosted && "$(uname -sm)" == 'Linux x86_64' && "$actual" == "$expected" ]]; then
            match=true
          fi
          mkdir -p .tmp/pr143-strict-evidence
          printf 'workflow=%s\nshard=%s\nexpected=%s\nactual=%s\nmatch=%s\n' \
            "$GITHUB_SHA" 01 "$expected" "$actual" "$match" > .tmp/pr143-strict-evidence/runner-route.txt
          printf 'match=%s\n' "$match" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.route.outputs.match == 'true'
        with:
          ref: ${{ github.sha }}
          path: .tmp/control
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/checkout@v7
        if: steps.route.outputs.match == 'true'
        with:
          ref: 43dd9d4e5eb8fb59573fd3bdfd7de7b5b6814879
          path: .tmp/base
          persist-credentials: false

      - uses: actions/checkout@v7
        if: steps.route.outputs.match == 'true'
        with:
          ref: 5e4d2b5c0c1a2ba867160d8fe666af0ca90466d8
          path: .tmp/head-git
          persist-credentials: false

      - uses: actions/checkout@v7
        if: steps.route.outputs.match == 'true'
        with:
          ref: 59a4167f129f0bff0e8425125fa02eae87fd347b
          path: .tmp/merge-base
          persist-credentials: false

      - uses: actions/setup-go@v7
        if: steps.route.outputs.match == 'true'
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify the current product trees and run four-arm link comparisons
        if: steps.route.outputs.match == 'true'
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: bash .tmp/control/scripts/diagnose-pr143-strict-native.sh

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pr143-gateway-current-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/pr143-strict-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Report a processor mismatch after preserving the routing receipt
        if: ${{ always() && steps.route.outputs.match == 'false' }}
        run: exit 3
