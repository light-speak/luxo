name: Attribute PR 143 auth middleware test layout

on:
  push:
    branches: [diagnostics/pr143-strict-layout]
    paths:
      - '.github/workflows/diagnose-pr143-strict-layout.yml'
      - 'scripts/diagnose-pr143-strict-native.*'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr143-strict-layout'
    name: Auth middleware test isolation (${{ matrix.slot }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Require the original 9V45 hosted CPU
        id: route
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          expected='AMD EPYC 9V45 96-Core Processor'
          actual=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | sed 's/[[:space:]]*$//')
          match=false
          if [[ "$RUNNER_KIND" == github-hosted && "$(uname -sm)" == 'Linux x86_64' && "$actual" == "$expected" ]]; then
            match=true
          fi
          mkdir -p .tmp/pr143-strict-evidence
          printf 'workflow=%s\nshard=%s\nexpected=%s\nactual=%s\nmatch=%s\n' \
            "$GITHUB_SHA" 06 "$expected" "$actual" "$match" > .tmp/pr143-strict-evidence/runner-route.txt
          printf 'match=%s\n' "$match" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.route.outputs.match == 'true'
        with:
          ref: ${{ github.sha }}
          path: .tmp/control
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/checkout@v7
        if: steps.route.outputs.match == 'true'
        with:
          ref: 36681c63627f4a3a4805bc6d19e908325614d3e9
          path: .tmp/base
          persist-credentials: false

      - uses: actions/checkout@v7
        if: steps.route.outputs.match == 'true'
        with:
          ref: 27fddbeee9a994e1ea1330df9b53b36d501c8652
          path: .tmp/head-git
          persist-credentials: false

      - uses: actions/setup-go@v7
        if: steps.route.outputs.match == 'true'
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify the original executable code and run four-arm auth isolation comparisons
        if: steps.route.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_KIND: ${{ runner.environment }}
        run: bash .tmp/control/scripts/diagnose-pr143-strict-native.sh

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pr143-auth-test-isolation-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/pr143-strict-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Report a processor mismatch after preserving the routing receipt
        if: ${{ always() && steps.route.outputs.match == 'false' }}
        run: exit 3
