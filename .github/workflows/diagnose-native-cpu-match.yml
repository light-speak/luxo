name: Run the pending native diagnostic for the assigned CPU model

on:
  push:
    branches: [diagnostics/native-cpu-match]
    paths: [.github/workflows/diagnose-native-cpu-match.yml]

permissions:
  actions: read
  contents: read

jobs:
  match:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/native-cpu-match'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Identify the assigned runner before checkout
        id: cpu
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p .tmp/native-cpu-selection
          receipt=.tmp/native-cpu-selection
          printf 'run=%s\nattempt=%s\nworkflow_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$receipt/selection.txt"
          uname -a > "$receipt/uname.txt"
          if [[ "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 || "$(uname -m)" != x86_64 ]]; then
            printf 'status=incompatible-host\n' >> "$receipt/selection.txt"
            exit 2
          fi
          lscpu > "$receipt/lscpu.txt"
          mapfile -t names < <(sed -n 's/^Model name:[[:space:]]*//p' "$receipt/lscpu.txt")
          if (( ${#names[@]} != 1 )) || [[ -z "${names[0]}" ]]; then
            printf 'status=invalid-model\n' >> "$receipt/selection.txt"
            exit 2
          fi
          printf 'cpu=%s\n' "${names[0]}" >> "$receipt/selection.txt"
          base=925f30ee1dcd45882b29130b8ed02836ed88317e
          evidence=
          case "${names[0]^^}" in
            'INTEL(R) XEON(R) 6975P-C')
              suite=pr71-gateway-current-profile
              printf 'suite=%s\n' "$suite" | tee -a "$receipt/selection.txt" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            'AMD EPYC 9V45 96-CORE PROCESSOR')
              suite=pr71-static-jwt
              diagnostic=3a9838348d630bcd0f806fbf38c67ee3e327924b
              tree=68f0cac3a999e8762f72d8006b594975a445c57b
              base=1117eb9ffcc0beef977abceec656a351b0988389
              head=4177d556d135cff1cd27e42798c0b082cf09f9b3
              input=pr71-static-jwt-formal-01.zip
              artifact=14932692737
              formal_run=45413131379
              digest=789c9c7220e6a1400461f35d3bae5b1e922e94a8a8c7cd7105604948bec0f9af
              ;;
            'AMD EPYC 9V74 80-CORE PROCESSOR')
              suite=pr72-boxed-json-header-causal
              diagnostic=480240c33e49e914aa04e96047a1ac0bcd470f06
              tree=a7e01c854083455a0d0cb79597220a08bab2c2e6
              base=4a660a0bcdee1eeb3c7a9dddcc95324d7967bec0
              head=8dcb6c8b97615f5148c43ff15e43b93320e1a342
              input=pr72-formal-shard-12.zip
              artifact=14924072511
              formal_run=45397856587
              digest=67c6414b54e7410188c0227b7266c30a16c9c0863fea7a1b8433c281feaddb25
              evidence='.tmp/native-cpu-worktree/.tmp/pr72-boxed-json-evidence-r.*/'
              ;;
            'AMD EPYC 7763 64-CORE PROCESSOR')
              suite=pr71-columnar
              diagnostic=8c98529d6bcc09ae80e42a7ee1023cd0568edaf1
              tree=a2867c9ef16a916ff5912b9397be1fef5a783e37
              base=1117eb9ffcc0beef977abceec656a351b0988389
              head=4177d556d135cff1cd27e42798c0b082cf09f9b3
              input=pr71-columnar-formal-08.zip
              artifact=14931164632
              formal_run=45413131379
              digest=094c81b14547cfbe5aa21d6b402c4b2574925fbafb701e503d9ac09354efb993
              evidence='.tmp/native-cpu-worktree/.tmp/hosted-columnar-merge-pr71-formal/'
              ;;
            *)
              printf 'status=no-matching-pending-scope\n' >> "$receipt/selection.txt"
              printf 'No pending native diagnostic matches the assigned model.\n' >&2
              exit 3
              ;;
          esac
          {
            printf 'suite=%s\ndiagnostic=%s\ntree=%s\nbase=%s\nhead=%s\n' "$suite" "$diagnostic" "$tree" "$base" "$head"
            printf 'artifact=%s\nformal_run=%s\ndigest=%s\ninput=%s\n' "$artifact" "$formal_run" "$digest" "$input"
            printf 'evidence=%s\n' "${evidence:-.tmp/native-cpu-worktree/.tmp/hosted-$suite/}"
          } | tee -a "$receipt/selection.txt" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        id: checkout
        with:
          path: native-cpu-dispatch
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch and verify only the selected diagnostic inputs
        id: primary_inputs
        if: ${{ steps.cpu.outputs.suite != 'pr71-gateway-current-profile' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC: ${{ steps.cpu.outputs.diagnostic }}
          DIAGNOSTIC_TREE: ${{ steps.cpu.outputs.tree }}
          PRODUCT_BASE: ${{ steps.cpu.outputs.base }}
          PRODUCT_HEAD: ${{ steps.cpu.outputs.head }}
          FORMAL_ARTIFACT: ${{ steps.cpu.outputs.artifact }}
          FORMAL_RUN: ${{ steps.cpu.outputs.formal_run }}
          FORMAL_DIGEST: ${{ steps.cpu.outputs.digest }}
          FORMAL_INPUT: ${{ steps.cpu.outputs.input }}
          SUITE: ${{ steps.cpu.outputs.suite }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/.tmp/native-cpu-worktree"
          receipt="$GITHUB_WORKSPACE/.tmp/native-cpu-selection"
          git -C native-cpu-dispatch fetch --no-tags origin "$DIAGNOSTIC" "$PRODUCT_BASE" "$PRODUCT_HEAD"
          git -C native-cpu-dispatch worktree add --detach "$root" "$DIAGNOSTIC"
          test "$(git -C "$root" rev-parse HEAD)" = "$DIAGNOSTIC"
          test "$(git -C "$root" rev-parse 'HEAD^{tree}')" = "$DIAGNOSTIC_TREE"
          sampler=scripts/diagnose-hosted-perf.sh
          sampler_digest=9e0a5f421f2e76674b819f81074a3d416a51174e0f93b858a63d20c27d64e072
          if [[ "$SUITE" == pr72-boxed-json-header-causal ]]; then
            sampler=scripts/diagnose-pr72-boxed-json/diagnose-native.sh
            sampler_digest=682270521e905a123429eb78a21980e16e7636b638c695fc35669833f7c9e513
          fi
          printf '%s  %s\n' "$sampler_digest" "$root/$sampler" | sha256sum -c -
          if [[ "$SUITE" == pr71-columnar ]]; then
            driver="$GITHUB_WORKSPACE/native-cpu-dispatch/scripts/diagnose-pr71-columnar.sh"
            printf '%s  %s\n' 6b88d84f5df69e8d9ac29ac48eaf34930abbc18109fefc1e6599629cce6ae53e "$driver" |
              sha256sum -c - > "$receipt/columnar-driver.txt"
            tested=3baa5b629d86749c6f5dc38dd9e540e0d11c39e9
            gh api "repos/light-speak/luxo/git/commits/$tested" > "$receipt/columnar-tested.json"
            jq -e --arg tested "$tested" --arg base "$PRODUCT_BASE" --arg head "$PRODUCT_HEAD" '
              .sha == $tested and .tree.sha == "175294b28abcbb21b68ba40fd6288ce63e2e1547"
              and [.parents[].sha] == [$base, $head]
            ' "$receipt/columnar-tested.json"
          fi
          if [[ "$SUITE" == pr72-boxed-json-header-causal ]]; then
            delta="$receipt/header-driver.patch"
            base64 -d "$GITHUB_WORKSPACE/native-cpu-dispatch/scripts/diagnose-pr72-boxed-json-r/driver-replay.patch.b64" > "$delta"
            printf '%s  %s\n' 42e647de1ba8d82510a7419bdac01d487ea8f9e7dbd1e52794d42be6c372f382 "$delta" |
              sha256sum -c - > "$receipt/header-driver-input.txt"
            git -C "$root" apply --check --whitespace=error-all "$delta"
            git -C "$root" apply --whitespace=error-all "$delta"
            printf '%s  %s\n' 86a7654778af0652957f7113dca0aeab607bb48bdff166132731a59c21f9a123 "$root/$sampler" |
              sha256sum -c - > "$receipt/header-driver-output.txt"
          fi
          mkdir -p "$root/.tmp"
          gh api "repos/light-speak/luxo/actions/artifacts/$FORMAL_ARTIFACT" > "$receipt/artifact-metadata.json"
          jq -e --arg id "$FORMAL_ARTIFACT" --arg run "$FORMAL_RUN" --arg head "$PRODUCT_HEAD" --arg digest "sha256:$FORMAL_DIGEST" '
            ((.id | tostring) == $id) and ((.workflow_run.id | tostring) == $run) and
            (.workflow_run.head_sha == $head) and (.digest == $digest) and (.expired == false)
          ' "$receipt/artifact-metadata.json"
          gh api "repos/light-speak/luxo/actions/artifacts/$FORMAL_ARTIFACT/zip" > "$root/.tmp/$FORMAL_INPUT"
          (cd "$root/.tmp" && printf '%s  %s\n' "$FORMAL_DIGEST" "$FORMAL_INPUT" | sha256sum -c -) > "$receipt/artifact-digest-check.txt"
          if [[ "$SUITE" == pr71-static-jwt ]]; then
            driver=scripts/diagnose-pr71-static-jwt.sh
            helper=scripts/diagnose-pr71-static-jwt.py
            printf '%s  %s\n' \
              2289b9051ead46a390cfdbf3d464dca6ec66f2c7df0ae2e0c5e962c8f1be8d6c "$root/$driver" \
              56b28eb47a64344be869fa9989a09b9e6361eea57c6a5fbafddf70e099e0f656 "$root/$helper" |
              sha256sum -c - > "$receipt/static-jwt-driver.txt"
            git -C "$root" fetch --no-tags origin 3baa5b629d86749c6f5dc38dd9e540e0d11c39e9
            (cd "$root" && bash "$driver" --probe)
            evidence="$root/.tmp/hosted-pr71-static-jwt"
            grep -Fxq 'match=true' "$evidence/runner.txt"
            mv "$root/.tmp/$FORMAL_INPUT" "$evidence/official.zip"
          fi
      - uses: actions/setup-go@v7
        id: go
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (steps.primary_inputs.outcome == 'success' || steps.cpu.outputs.suite == 'pr71-gateway-current-profile' || steps.cpu.outputs.suite == 'pr72-boxed-json-header-causal') }}
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Run the pinned diagnostic on the same runner
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.primary_inputs.outcome == 'success' }}
        timeout-minutes: 28
        working-directory: .tmp/native-cpu-worktree
        env:
          SUITE: ${{ steps.cpu.outputs.suite }}
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          case "$SUITE" in
            pr71-static-jwt)
              exec bash scripts/diagnose-pr71-static-jwt.sh run
              ;;
            pr72-boxed-json-header-causal)
              exec bash scripts/diagnose-pr72-boxed-json/diagnose-native.sh . r .tmp/pr72-formal-shard-12.zip
              ;;
            pr71-columnar)
              exec bash "$GITHUB_WORKSPACE/native-cpu-dispatch/scripts/diagnose-pr71-columnar.sh" . .tmp/pr71-columnar-formal-08.zip
              ;;
            *) exit 2 ;;
          esac
      - name: Measure the remaining PR 71 leaf controls on the assigned runner
        if: ${{ !cancelled() && steps.go.outcome == 'success' && (steps.cpu.outputs.suite == 'pr71-gateway-current-profile' || steps.cpu.outputs.suite == 'pr72-boxed-json-header-causal') }}
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ steps.cpu.outputs.suite }}
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          dispatch="$GITHUB_WORKSPACE/native-cpu-dispatch"
          receipt="$GITHUB_WORKSPACE/.tmp/native-cpu-selection"
          driver="$dispatch/scripts/diagnose-pr71-secondary.sh"
          helper="$dispatch/scripts/diagnose-pr71-secondary.py"
          [[ "$(git -C "$dispatch" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          printf '%s  %s\n' \
            712d3330d3f36e26a82923f006a97527b30bed3f9796c2f7dfa651f36a0735c5 "$driver" \
            83445334e93a9f6d37c7e97541180a001549713284bbe59a0f206c4610987074 "$helper" | sha256sum -c -
          case "$SUITE" in
            pr71-gateway-current-profile) scope=gateway-identity ;;
            pr72-boxed-json-header-causal) scope=rpc-trace-local ;;
            *) exit 2 ;;
          esac
          IFS=$'\t' read -r _ _ _ _ _ artifact digest _ < <(python3 "$helper" tuple "$scope")
          [[ "$artifact" =~ ^[0-9]+$ && "$digest" =~ ^[a-f0-9]{64}$ ]]
          git -C "$dispatch" fetch --no-tags origin \
            1117eb9ffcc0beef977abceec656a351b0988389 4177d556d135cff1cd27e42798c0b082cf09f9b3 \
            3baa5b629d86749c6f5dc38dd9e540e0d11c39e9 dd6405a02c653c8f2da90ff8ea81795a6781033b \
            3a9838348d630bcd0f806fbf38c67ee3e327924b
          gh api "repos/light-speak/luxo/actions/artifacts/$artifact" > "$receipt/pr71-$scope-metadata.json"
          jq -e --arg id "$artifact" --arg digest "sha256:$digest" '
            ((.id | tostring) == $id) and (.workflow_run.id == 45413131379) and
            (.workflow_run.head_sha == "4177d556d135cff1cd27e42798c0b082cf09f9b3") and
            (.digest == $digest) and (.expired == false)
          ' "$receipt/pr71-$scope-metadata.json"
          mkdir -p "$dispatch/.tmp"
          archive=$(mktemp "$dispatch/.tmp/pr71-input.XXXXXXXX")
          trap 'rm -f -- "$archive"' EXIT
          gh api "repos/light-speak/luxo/actions/artifacts/$artifact/zip" > "$archive"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum -c - > "$receipt/pr71-$scope-digest-check.txt"
          bash "$driver" "$dispatch" "$scope" "$archive"
      - name: Preserve the CPU selection and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-cpu-match-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/native-cpu-selection/
            ${{ steps.cpu.outputs.evidence }}
            native-cpu-dispatch/.tmp/hosted-pr71-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
