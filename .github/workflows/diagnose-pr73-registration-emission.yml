name: Measure PR 73 registration source emission

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-pr73-registration-emission.yml
      - .github/qualification/pr73-registration-emission.patch.b64
      - scripts/diagnose-pr73-registration-emission.sh

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'light-speak/luxo'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the frozen public source commits
        run: >-
          git fetch --no-tags origin
          ca818da9bf89e82dc6f5bd2f539e4dfdd576a801
          d8b686b516ed5ab89e185093ca836756901fb56c
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Compare matching fixtures with the original gate
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: '1'
        run: bash scripts/diagnose-pr73-registration-emission.sh
      - name: Preserve exact sources and raw samples
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-pr73-registration-emission-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr73-registration-emission/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove the uploaded runner evidence
        if: always()
        run: rm -rf -- .tmp/hosted-pr73-registration-emission
