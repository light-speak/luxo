name: Qualify RPC benchmark regression tests on Linux

on:
  push:
    branches: [diagnostics/rpc-benchmark-reachable-tests]
    paths:
      - .github/workflows/qualify-rpc-benchmark-reachable-tests.yml
      - .github/qualification/rpc-benchmark-reachable-tests.patch.b64
      - .github/qualification/rpc-benchmark-post-lstat.patch.b64

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'light-speak/luxo'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOAMD64: v1
      CGO_ENABLED: '1'
      RPC_TEST_BASE: ca818da9bf89e82dc6f5bd2f539e4dfdd576a801
      RPC_TEST_QUALIFIED_TREE: 011cb034493a360bfd6e0494faed10918f0104fd
      RPC_TEST_QUALIFIED_PATCH_SHA256: 34d7f8c66c41e6388225c166dba1c75df02ab26197a382b5ab183d31e58eb1a6
      RPC_TEST_AUGMENTED_TREE: debf975d828439adf2bc78315443c2dfcdd1606e
      RPC_TEST_AUGMENTED_PATCH_SHA256: 4a149ce5d9c9cf53b7a13b6bb14883d67f73afc503f3742b059c2b1911850426
      RPC_TEST_FINAL_TREE: 69633233dc688906916718773880e776741cb3fd
      RPC_TEST_RESOLVER_PATCH_SHA256: 828a4688ef1f8f66266903ca19906b1b1a4cf5bae90a2afc0f0837d7e8bc0150
      RPC_TEST_PATHS: |
        scripts/benchrun/main_test.go
        scripts/benchrun/rpc_fixture.go

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Restore the qualified tree and the exact resolver change
        id: restore
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          root=$(git rev-parse --show-toplevel)
          evidence="$root/.tmp/rpc-reachable-tests-evidence"
          source="$root/.tmp/rpc-reachable-tests-source"
          test ! -L "$root/.tmp" && test ! -e "$source" && test ! -L "$source"
          mkdir -p "$root/.tmp"
          mkdir "$evidence"
          if ! git cat-file -e "$RPC_TEST_BASE^{commit}"; then
            git fetch --no-tags origin "$RPC_TEST_BASE"
          fi
          base64 -d < .github/qualification/rpc-benchmark-marker.patch.b64 > "$evidence/qualified.patch"
          base64 -d < .github/qualification/rpc-benchmark-reachable-tests.patch.b64 > "$evidence/augmented.patch"
          base64 -d < .github/qualification/rpc-benchmark-post-lstat.patch.b64 > "$evidence/resolver.patch"
          (
            cd "$evidence"
            printf '%s  qualified.patch\n%s  augmented.patch\n%s  resolver.patch\n' \
              "$RPC_TEST_QUALIFIED_PATCH_SHA256" "$RPC_TEST_AUGMENTED_PATCH_SHA256" "$RPC_TEST_RESOLVER_PATCH_SHA256" | sha256sum -c -
          ) > "$evidence/patch-check.log"
          git worktree add --detach "$source" "$RPC_TEST_BASE"
          (
            cd "$source"
            git apply --index --check --whitespace=error "$evidence/qualified.patch"
            git apply --index --whitespace=error "$evidence/qualified.patch"
            test "$(git write-tree)" = "$RPC_TEST_QUALIFIED_TREE"
            git apply --index --check --whitespace=error "$evidence/augmented.patch"
            git apply --index --whitespace=error "$evidence/augmented.patch"
            git apply --index --reverse --check "$evidence/augmented.patch"
            test "$(git write-tree)" = "$RPC_TEST_AUGMENTED_TREE"
            git apply --index --check --whitespace=error "$evidence/resolver.patch"
            git apply --index --whitespace=error "$evidence/resolver.patch"
            git apply --index --reverse --check "$evidence/resolver.patch"
            test "$(git write-tree)" = "$RPC_TEST_FINAL_TREE"
            git diff --exit-code
            git diff --check "$RPC_TEST_AUGMENTED_TREE" "$RPC_TEST_FINAL_TREE"
            git diff --name-only "$RPC_TEST_AUGMENTED_TREE" "$RPC_TEST_FINAL_TREE" > "$evidence/changed-paths.txt"
            printf '%s' "$RPC_TEST_PATHS" | cmp "$evidence/changed-paths.txt" -
            for subtree in pkg internal cmd; do
              qualified=$(git rev-parse "$RPC_TEST_QUALIFIED_TREE:$subtree")
              final=$(git rev-parse "$RPC_TEST_FINAL_TREE:$subtree")
              test "$qualified" = "$final"
              printf '%s %s %s\n' "$subtree" "$qualified" "$final"
            done > "$evidence/identical-subtrees.txt"
            git diff --exit-code "$RPC_TEST_QUALIFIED_TREE" "$RPC_TEST_FINAL_TREE" -- .github/workflows/test.yml
            paths=()
            while IFS= read -r path; do paths+=("$path"); done < "$evidence/changed-paths.txt"
            sha256sum "${paths[@]}" > "$evidence/test-sources.sha256"
            gofmt -s -l "${paths[@]}" > "$evidence/gofmt.log"
            test ! -s "$evidence/gofmt.log"
          )
          printf 'workflow=%s\nbase=%s\nqualified_tree=%s\naugmented_tree=%s\nresolver_tree=%s\n' \
            "$GITHUB_SHA" "$RPC_TEST_BASE" "$RPC_TEST_QUALIFIED_TREE" "$RPC_TEST_AUGMENTED_TREE" "$RPC_TEST_FINAL_TREE" > "$evidence/revisions.txt"
          sh "$source/scripts/setup-modules.sh" "$source"

      - name: Run Linux script race tests and the EFBIG regression
        run: |
          set -euo pipefail
          root=$(git rev-parse --show-toplevel)
          evidence="$root/.tmp/rpc-reachable-tests-evidence"
          cd "$root/.tmp/rpc-reachable-tests-source"
          export GOWORK="$PWD/go.work"
          go version > "$evidence/go-version.txt"
          test "$(cat "$evidence/go-version.txt")" = 'go version go1.27.1 linux/amd64'
          go env -json GOOS GOARCH GOAMD64 CGO_ENABLED GOWORK > "$evidence/go-env.json"
          go test -p 2 -race ./scripts/... -cover -coverprofile="$evidence/scripts.coverage" \
            -count=1 -timeout=5m -json > "$evidence/scripts.jsonl"
          go test -p 2 -race ./scripts/benchrun -run '^TestWritePerformanceOverlayReportsWriteFailure$' \
            -count=1 -timeout=30s -json > "$evidence/write-failure.jsonl"
          go tool cover -func="$evidence/scripts.coverage" > "$evidence/coverage-summary.txt"
          for fn in verifyEqualInventories compileBenchmarks writePerformanceOverlay performanceOverlay performanceOverlayWithPathResolver; do
            grep -E "[[:space:]]$fn[[:space:]]+100\\.0%$" "$evidence/coverage-summary.txt"
          done > "$evidence/required-functions.txt"
          python3 - "$evidence" <<'PY'
          import json
          from pathlib import Path
          import sys

          evidence = Path(sys.argv[1])
          root = "github.com/light-speak/luxo/scripts/"
          write_failure = (root + "benchrun", "TestWritePerformanceOverlayReportsWriteFailure")
          required = {
              "scripts.jsonl": [(root + "benchplan", "TestVerifyEqualInventoriesReportsInvalidArguments"),
                                (root + "benchrun", "TestCompilePerformanceKeepsBenchmarksAndSeparatesCorrectness"),
                                (root + "benchrun", "TestPerformanceOverlayReportsFixtureResolutionFailure"),
                                (root + "benchrun", "TestPerformanceOverlayRejectsInvalidPaths/symlinked_ancestor"),
                                (root + "benchrun", "TestPerformanceOverlayRejectsInvalidPaths/unreadable_fixture"),
                                write_failure],
              "write-failure.jsonl": [write_failure],
          }
          for name, cases in required.items():
              events = [json.loads(line) for line in (evidence / name).read_text().splitlines()]
              assert all(event.get("Action") not in ("fail", "build-fail") for event in events)
              passed = {(event.get("Package"), event.get("Test")) for event in events if event.get("Action") == "pass"}
              assert set(cases) <= passed, sorted(set(cases) - passed)
          (evidence / "required-regressions.json").write_text(json.dumps(required, indent=2) + "\n")
          PY

      - name: Verify static checks for scripts
        run: |
          set -euo pipefail
          root=$(git rev-parse --show-toplevel)
          evidence="$root/.tmp/rpc-reachable-tests-evidence"
          cd "$root/.tmp/rpc-reachable-tests-source"
          export GOWORK="$PWD/go.work"
          go vet -p 2 ./scripts/... > "$evidence/vet.log" 2>&1
          export GOBIN="$PWD/.tmp/bin"
          mkdir -p "$GOBIN"
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          go version -m "$GOBIN/gocyclo" > "$evidence/gocyclo-version.txt"
          PATH="$GOBIN:$PATH" sh scripts/check-go.sh complexity scripts/ > "$evidence/complexity.log" 2>&1

      - name: Verify the final source
        if: always() && steps.restore.outcome == 'success'
        run: |
          set -euo pipefail
          root=$(git rev-parse --show-toplevel)
          evidence="$root/.tmp/rpc-reachable-tests-evidence"
          cd "$root/.tmp/rpc-reachable-tests-source"
          sha256sum -c "$evidence/test-sources.sha256" > "$evidence/final-source-check.log"
          git diff --exit-code
          test "$(git write-tree)" = "$RPC_TEST_FINAL_TREE"
          printf '%s\n' "$RPC_TEST_FINAL_TREE" > "$evidence/final-tree.txt"

      - name: Remove the owned test worktree
        if: always()
        run: |
          set -euo pipefail
          root=$(git rev-parse --show-toplevel)
          evidence="$root/.tmp/rpc-reachable-tests-evidence"
          source="$root/.tmp/rpc-reachable-tests-source"
          test ! -L "$root/.tmp" && test ! -L "$evidence" && test ! -L "$source"
          mkdir -p "$evidence"
          if grep -Fx "worktree $source" <<< "$(git worktree list --porcelain)" > /dev/null; then
            git worktree remove --force "$source"
          fi
          test ! -e "$source"
          printf 'owned_test_worktree_removed=true\n' > "$evidence/cleanup.txt"

      - name: Preserve verified Linux test evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rpc-reachable-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/rpc-reachable-tests-evidence/
          if-no-files-found: error
          retention-days: 14
