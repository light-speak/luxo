name: Diagnose hosted performance for PRs 74 and 78

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-hosted-perf.yml
      - scripts/diagnose-hosted-perf.sh
      - scripts/diagnose-h2-shutdown-opening.go.txt
      - scripts/diagnose-json-int.go.txt
      - scripts/diagnose-optimization-patches.json

permissions:
  contents: read

concurrency:
  group: hosted-perf-pr74-pr78
  cancel-in-progress: false

jobs:
  diagnose-hosted-perf:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [pr78]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Collect paired A/A and A/B measurements
        env:
          GOTOOLCHAIN: local
          BENCHMARK_SUITE: ${{ matrix.suite }}
        run: bash scripts/diagnose-hosted-perf.sh "$BENCHMARK_SUITE"

      - name: Preserve measurements and provenance
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-perf-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-perf-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Remove local evidence after upload
        if: always()
        run: rm -rf -- .tmp/hosted-perf-evidence
