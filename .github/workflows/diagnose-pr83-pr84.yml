name: Diagnose PR 83 and 84 runtime timing

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-pr83-pr84.yml
      - scripts/diagnose-pr83-pr84.sh
      - scripts/diagnose-pr83-pr84.tsv

permissions:
  contents: read

concurrency:
  group: hosted-pr83-pr84
  cancel-in-progress: false

jobs:
  diagnose-pr83-pr84:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        suite: [pr83, pr84-values, pr84-runtime]
    env:
      BENCHMARK_SUITE: ${{ matrix.suite }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Collect default-link A/A and A/B measurements
        timeout-minutes: 19
        run: bash scripts/diagnose-pr83-pr84.sh "$BENCHMARK_SUITE"
      - name: Preserve raw measurements and binary layout
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-pr83-pr84-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr83-pr84-${{ matrix.suite }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove local evidence after upload
        if: always()
        run: rm -rf -- ".tmp/hosted-pr83-pr84-$BENCHMARK_SUITE"
