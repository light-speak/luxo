name: Dart release on Windows

on:
  push:
    branches: [main]
    paths:
      - 'packages/dart/**'
      - '.github/workflows/dart-release-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/dart/**'
      - '.github/workflows/dart-release-windows.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dart-release-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'

      - name: Install dependencies
        run: dart pub get

      - name: Verify release artifact ownership and publication
        run: >-
          dart test --concurrency=1 --reporter expanded test/selection_build_test.dart
          --name '^(build ownership accepts a trailing directory separator|release publication preserves an output created after validation|release publication reports a missing artifact error|AOT artifact retains call-site selections after snapshot cleanup)$'
