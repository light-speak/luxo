name: Attribute the PR 74 GatewayIdentity timing failures

on:
  push:
    branches: [diagnostics/pr74-current-confirmations]
    paths:
      - .github/workflows/diagnose-pr74-gateway-identity.yml
      - scripts/diagnose-pr74-gateway-identity.sh

permissions:
  actions: read
  contents: read

jobs:
  compare:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr74-current-confirmations'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Require the original host CPU before fetching sources or setting up Go
        id: cpu
        run: bash scripts/diagnose-pr74-gateway-identity.sh --probe
      - name: Fetch the exact tested revisions and formal evidence
        if: steps.cpu.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/diagnose-pr74-gateway-identity.sh --fetch
      - uses: actions/setup-go@v7
        if: steps.cpu.outputs.match == 'true'
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Run same-host ordinary and isolated A/A and A/H controls
        if: steps.cpu.outputs.match == 'true'
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: '1'
        run: bash scripts/diagnose-pr74-gateway-identity.sh
      - name: Preserve source, symbol, order, sample and gate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr74-gateway-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr74-gateway-identity/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
