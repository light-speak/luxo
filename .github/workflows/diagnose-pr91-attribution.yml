name: Attribute PR 91 exact native compiler benchmark failures

on:
  workflow_dispatch:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-pr91-attribution.yml
      - scripts/diagnose-pr91-attribution.sh
      - scripts/diagnose-pr91-attribution.py
      - scripts/diagnose-pr91/**

permissions:
  contents: read

concurrency:
  group: hosted-pr91-attribution
  cancel-in-progress: false

jobs:
  attribute-pr91:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [codegen, semantic]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Run exact full and symmetric product comparisons on one native runner
        timeout-minutes: 85
        env:
          GOTOOLCHAIN: local
          GOAMD64: v1
          CGO_ENABLED: '1'
        run: bash scripts/diagnose-pr91-attribution.sh '${{ matrix.suite }}'
      - name: Preserve source, actual executables, symbols, process samples and verdicts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosted-pr91-attribution-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr91-attribution-${{ matrix.suite }}/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
      - name: Remove owned runner evidence after upload
        if: always()
        run: rm -rf -- .tmp/hosted-pr91-attribution-${{ matrix.suite }}
