name: Attribute PR 72 ReadBytes timing

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-pr72-read-offset-attribution.yml
      - scripts/diagnose-pr72-read-offset-attribution.sh

permissions:
  contents: read

concurrency:
  group: hosted-pr72-read-offset-attribution
  cancel-in-progress: false

jobs:
  diagnose-pr72-read-offset-attribution:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Measure four link roles on one runner
        timeout-minutes: 20
        env:
          GOTOOLCHAIN: local
        run: bash scripts/diagnose-pr72-read-offset-attribution.sh
      - name: Preserve exact scope, symbols, raw process results and verdicts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-pr72-read-offset-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr72-read-offset-attribution/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove local evidence after upload
        if: always()
        run: rm -rf -- .tmp/hosted-pr72-read-offset-attribution
