name: Replay targeted hosted performance confirmation

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-targeted-perf.yml
      - scripts/replay-targeted-perf.sh

permissions:
  contents: read

jobs:
  replay-targeted-perf:
    if: github.repository == 'light-speak/luxo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Run the pinned production sampling and enforcement steps
        env:
          GOTOOLCHAIN: local
        run: bash scripts/replay-targeted-perf.sh --allocation-control
      - name: Upload scoped replay evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-targeted-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/targeted-replay/.tmp/benchmark-*
            .tmp/targeted-replay/.tmp/benchstat-*
            .tmp/targeted-replay/.tmp/replay-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
