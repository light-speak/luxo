name: Recheck sealed compiler performance on EPYC 7763

on:
  push:
    branches: [diagnostics/pr156-159-current-native]

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
          persist-credentials: false

      - id: route
        name: Match the original native CPU before building
        run: python3 scripts/diagnose-pr156-159-current/run.py --probe

      - if: steps.route.outputs.cpu != ''
        uses: actions/checkout@v7
        with:
          ref: 43dd9d4e5eb8fb59573fd3bdfd7de7b5b6814879
          path: .tmp/current-a
          persist-credentials: false

      - if: steps.route.outputs.cpu != ''
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false

      - if: steps.route.outputs.cpu != ''
        name: Verify current source trees and native timing
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: python3 scripts/diagnose-pr156-159-current/run.py "${{ steps.route.outputs.cpu }}"

      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr156-159-current-${{ github.run_id }}-${{ github.run_attempt }}-slot-${{ matrix.slot }}
          path: .tmp/pr156-159-current
          if-no-files-found: error
          retention-days: 14

  qualification:
    needs: [witness]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/diagnose-pr156-159-current
          persist-credentials: false

      - name: Verify the original CPU and both strict gate receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          receipts=$(mktemp -d .tmp/pr156-159-receipts.XXXXXXXX)
          trap 'rm -rf -- "$receipts"' EXIT
          gh run download "$GITHUB_RUN_ID" --pattern "pr156-159-current-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-slot-*" --dir "$receipts"
          python3 scripts/diagnose-pr156-159-current/run.py --summarize "$receipts"
