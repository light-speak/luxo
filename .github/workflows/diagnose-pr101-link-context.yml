name: Attribute PR 101 timing on one native runner

on:
  push:
    branches: [diagnostics/pr101-link-context]
    paths:
      - .github/workflows/diagnose-pr101-link-context.yml
      - scripts/diagnose-pr101-link-context.sh

permissions:
  contents: read

jobs:
  attribute:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/pr101-link-context'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Fetch immutable diagnostic inputs
        run: |
          git fetch --no-tags origin \
            ca818da9bf89e82dc6f5bd2f539e4dfdd576a801 \
            8f6633bfc9f325c857e1217112a5e2039e2d85de \
            61521c06948d6f4cdf04cd94abb6a19fdd2c5ac7
      - name: Run native, frozen, and RPC isolation comparisons
        run: bash scripts/diagnose-pr101-link-context.sh
      - name: Preserve layout, raw samples, and diagnostic verdicts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr101-link-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/pr101-link-context-evidence/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
