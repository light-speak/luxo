name: Attribute PR 71 timing with exact JWT linkage controls

on:
  push:
    branches: [diagnostics/hosted-perf-pr71-pr72]
    paths:
      - .github/workflows/diagnose-pr71-latest-native-diagnostic-auth.yml
      - scripts/diagnose-pr71-latest-native-diagnostic-auth.sh

permissions:
  contents: read

concurrency:
  group: hosted-pr71-latest-native-diagnostic-auth
  cancel-in-progress: false

jobs:
  diagnose-pr71-latest-native-diagnostic-auth:
    if: github.repository == 'light-speak/luxo' && github.ref == 'refs/heads/diagnostics/hosted-perf-pr71-pr72'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Collect full, lean and direct JWT comparisons
        timeout-minutes: 18
        env:
          GOTOOLCHAIN: local
        run: bash scripts/diagnose-pr71-latest-native-diagnostic-auth.sh
      - name: Preserve raw samples, scope and symbol evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-pr71-latest-native-diagnostic-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/hosted-pr71-latest-native-diagnostic-auth/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Remove local evidence after upload
        if: always()
        run: rm -rf -- .tmp/hosted-pr71-latest-native-diagnostic-auth
