allprojects {
    plugins.withId('org.jetbrains.kotlin.jvm') {
        if (project == rootProject) {
            tasks.register('sqlConsumerClasspath') {
                dependsOn tasks.named('classes')
                doLast {
                    def destination = System.getenv('LUXO_SQL_CLASSPATH')
                    if (!destination) throw new GradleException('Missing LUXO_SQL_CLASSPATH')
                    def entries = sourceSets.main.runtimeClasspath + configurations.testRuntimeClasspath
                    file(destination).text = entries.files.findAll { it.exists() }.join(File.pathSeparator)
                }
            }
        }
    }
}
