name: luxo_client
description: "Luxo SDK for Dart/Flutter — Schema-driven API framework. One .luxo file generates API + DB + SDK. Features: HTTP/2 & WebSocket transport, binary codec (3x faster than JSON), compile-time field selection ($select), typed client codegen, and auto-reconnect."
version: 0.1.2
homepage: https://github.com/light-speak/luxo

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  fixnum: ^1.1.1
  http: ^1.2.0
  analyzer: ^14.4.0
  build: ^4.0.11
  glob: ^2.1.0
  web: ^1.1.1

dev_dependencies:
  test: ^1.24.0
