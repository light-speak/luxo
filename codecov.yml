coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%

ignore:
  - "cmd/**"              # CLI entry point — IO/subprocess, not unit testable
  - "pkg/lux/migrate/**"  # requires real DB for integration tests
  - "pkg/lux/mysql/**"    # not yet implemented
  - "pkg/lsp/**"          # LSP protocol IO — needs mock editor, not unit testable
  - "pkg/ast/ast.go"      # interface method stubs (exprNode/stmtNode/GetPos) — empty bodies, untestable
